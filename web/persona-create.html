<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>buddle · 페르소나</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<script>
/* === security.js (inlined: no external dependency) === */
/* buddle frontend security utilities.
 *
 * Threat model & mitigations (see docs/security/SECURITY_FRONTEND.md):
 *  - Stored XSS: persona names, post text, topics come from other users via the
 *    API. NEVER inject them as HTML. Use esc() for text or el()/text() for DOM.
 *  - DOM-clobbering / injection via attributes: setText/setAttr helpers only.
 *  - Open redirect / javascript: URLs: safeUrl() allowlists schemes.
 *  - Token theft: tokens live in memory only (api.js), never in localStorage,
 *    never interpolated into HTML or URLs.
 *  - Clickjacking: pages set frame-ancestors via CSP meta + framebust check.
 *  - Prototype pollution: freeze, and reject __proto__ keys when parsing.
 */
(function (global) {
  "use strict";

  const NAMED = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "`": "&#96;" };

  /** Escape a string for safe insertion into HTML text/attribute context. */
  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"'`]/g, (c) => NAMED[c]);
  }

  /** Create an element with safe text + attributes (no HTML parsing). */
  function el(tag, attrs, textContent) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const k of Object.keys(attrs)) {
        const v = attrs[k];
        if (v == null) continue;
        if (k === "class") node.className = String(v);
        else if (k === "dataset" && typeof v === "object") {
          for (const dk of Object.keys(v)) node.dataset[dk] = String(v[dk]);
        } else if (/^on/i.test(k)) {
          // never accept event handlers as strings
          if (typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
        } else {
          node.setAttribute(k, String(v));
        }
      }
    }
    if (textContent != null) node.textContent = String(textContent);
    return node;
  }

  /** Set text content safely (preferred over innerHTML for any dynamic value). */
  function setText(node, value) { node.textContent = String(value == null ? "" : value); }

  /** Allowlist URL schemes; block javascript:, data:, vbscript:, etc. */
  function safeUrl(url) {
    const u = String(url || "").trim();
    if (/^(https?:|mailto:|\/|#)/i.test(u) && !/^javascript:/i.test(u)) return u;
    return "#";
  }

  /** Client-side input validation (defense in depth; server validates too). */
  const validate = {
    email(s) { return typeof s === "string" && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s) && s.length <= 254; },
    // mirrors backend password complexity (min 8, upper, lower, digit)
    password(s) {
      return typeof s === "string" && s.length >= 8 && s.length <= 200 &&
        /[a-z]/.test(s) && /[A-Z]/.test(s) && /\d/.test(s);
    },
    personaName(s) { return typeof s === "string" && s.trim().length >= 1 && s.length <= 64; },
    thought(s) { return typeof s === "string" && s.trim().length >= 1 && s.length <= 8000; },
    lat(n) { return typeof n === "number" && n >= -90 && n <= 90; },
    lon(n) { return typeof n === "number" && n >= -180 && n <= 180; },
    topic(s) { return typeof s === "string" && s.trim().length >= 1 && s.length <= 64; },
  };

  /** Reject prototype-pollution keys when handling parsed objects. */
  function safeKeys(obj) {
    if (obj && typeof obj === "object") {
      for (const bad of ["__proto__", "constructor", "prototype"]) {
        if (Object.prototype.hasOwnProperty.call(obj, bad)) delete obj[bad];
      }
    }
    return obj;
  }

  /** Frame-busting: if loaded inside a foreign frame, break out (anti-clickjacking). */
  function preventFraming() {
    try {
      if (global.top !== global.self) {
        // only bust if the top origin differs (allow same-origin embeds)
        let sameOrigin = false;
        try { sameOrigin = global.top.location.origin === global.location.origin; } catch (_) { sameOrigin = false; }
        if (!sameOrigin) global.top.location = global.location.href;
      }
    } catch (_) { /* cross-origin access throws — already protected by CSP */ }
  }

  /** Inject a restrictive CSP via meta (belt-and-suspenders with server headers). */
  function applyCSP() {
    if (document.querySelector('meta[http-equiv="Content-Security-Policy"]')) return;
    const m = document.createElement("meta");
    m.httpEquiv = "Content-Security-Policy";
    m.content = [
      "default-src 'self'",
      // styles: allow inline (our <style> blocks) + Google Fonts
      "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com",
      "font-src 'self' https://fonts.gstatic.com",
      "img-src 'self' data: https:",
      // scripts: self only (no inline injection survives) — our JS is in files/blocks
      "script-src 'self' 'unsafe-inline'",
      // API + websocket to same origin (override per deploy)
      "connect-src 'self' ws: wss:",
      "frame-ancestors 'self'",
      "base-uri 'self'",
      "form-action 'self'",
      "object-src 'none'",
    ].join("; ");
    document.head.appendChild(m);
  }

  /** One-call hardening for every page. */
  function harden() {
    applyCSP();
    preventFraming();
  }

  global.sec = Object.freeze({
    esc, el, setText, safeUrl, validate, safeKeys, preventFraming, applyCSP, harden,
  });
})(window);

</script>
<script>
/* === api.js (inlined) === */
/* buddle frontend API client — single source of truth for backend calls.
 *
 * Every field name / route here matches the FastAPI backend exactly (verified
 * against the Pydantic schemas and router paths). Screens import this instead
 * of hand-writing fetch() calls, so the front<->back contract lives in one place.
 *
 * Auth: JWT bearer. Tokens are cached in memory and write-through persisted to
 * sessionStorage (tab-scoped) so page navigation and refresh keep the session.
 * sessionStorage over localStorage on purpose: it dies with the tab, which
 * shrinks the blast radius of any XSS-stolen token and avoids cross-tab leaks.
 * Base URL defaults to same-origin; override with window.BUDDLE_API_BASE.
 */
(function (global) {
  "use strict";

  const BASE = global.BUDDLE_API_BASE || "";
  const TOKEN_KEY = "buddle.auth.v1";
  let accessToken = null;
  let refreshToken = null;

  // Hydrate once per page load. Storage may be unavailable (private mode,
  // blocked) — in that case we silently fall back to memory-only tokens.
  (function hydrate() {
    try {
      const raw = global.sessionStorage && global.sessionStorage.getItem(TOKEN_KEY);
      if (!raw) return;
      const t = JSON.parse(raw);
      if (t && typeof t.a === "string") {
        accessToken = t.a;
        refreshToken = typeof t.r === "string" ? t.r : null;
      }
    } catch (_) { /* memory-only */ }
  })();

  function persistTokens() {
    try {
      if (!global.sessionStorage) return;
      if (accessToken) {
        global.sessionStorage.setItem(TOKEN_KEY, JSON.stringify({ a: accessToken, r: refreshToken }));
      } else {
        global.sessionStorage.removeItem(TOKEN_KEY);
      }
    } catch (_) { /* quota/blocked → memory-only */ }
  }

  function setTokens(access, refresh) {
    accessToken = access || null;
    if (refresh !== undefined) refreshToken = refresh || null;
    persistTokens();
  }
  function clearTokens() { accessToken = null; refreshToken = null; persistTokens(); }

  async function request(method, path, body, { auth = true, retry = true } = {}) {
    const headers = { "Content-Type": "application/json" };
    if (auth && accessToken) headers["Authorization"] = `Bearer ${accessToken}`;
    const res = await fetch(BASE + path, {
      method,
      headers,
      body: body != null ? JSON.stringify(body) : undefined,
    });

    // transparent refresh on 401 (once)
    if (res.status === 401 && auth && retry && refreshToken) {
      const ok = await tryRefresh();
      if (ok) return request(method, path, body, { auth, retry: false });
    }
    if (!res.ok) {
      let detail = res.statusText;
      try { const j = await res.json(); detail = j.message || j.detail || detail; } catch (_) {}
      throw new ApiError(res.status, detail);
    }
    if (res.status === 204) return null;
    const ct = res.headers.get("content-type") || "";
    return ct.includes("application/json") ? res.json() : res.text();
  }

  class ApiError extends Error {
    constructor(status, message) { super(message); this.name = "ApiError"; this.status = status; }
  }

  async function tryRefresh() {
    try {
      const data = await request("POST", "/v1/auth/refresh",
        { refresh_token: refreshToken }, { auth: false, retry: false });
      setTokens(data.access_token, data.refresh_token);
      return true;
    } catch (_) { clearTokens(); return false; }
  }

  /* ── Auth ──────────────────────────────────────────────── */
  const auth = {
    // SignupRequest: { email, password, password_confirm }
    async signup(email, password, passwordConfirm) {
      return request("POST", "/v1/auth/signup",
        { email, password, password_confirm: passwordConfirm }, { auth: false });
    },
    // LoginRequest: { email, password } -> { access_token, refresh_token }
    async login(email, password) {
      const data = await request("POST", "/v1/auth/login",
        { email, password }, { auth: false });
      setTokens(data.access_token, data.refresh_token);
      return data;
    },
    // Revoke the refresh-token family server-side, then drop local tokens.
    // Network failures are ignored: the family still expires naturally.
    async logout() {
      const rt = refreshToken;
      try {
        if (rt && accessToken) {
          await request("POST", "/v1/auth/logout", { refresh_token: rt }, { retry: false });
        }
      } catch (_) { /* best-effort revoke */ }
      clearTokens();
    },
    isAuthed() { return !!accessToken; },
  };

  /* Soft auth gate for screens.
   *  - token present              → resolves true (render live).
   *  - no token + backend up      → redirects to login.html?next=… (resolves true;
   *                                  navigation is already underway).
   *  - no token + backend down    → resolves false (screen keeps offline demo mode).
   * This preserves the "open the file standalone and get a demo" property. */
  async function requireAuth(next) {
    if (accessToken) return true;
    let backendUp = false;
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 1500);
      const res = await fetch(BASE + "/health", { signal: ctl.signal });
      clearTimeout(timer);
      backendUp = res.ok;
    } catch (_) { backendUp = false; }
    if (backendUp) {
      const target = next || (location.pathname.split("/").pop() + location.search);
      location.replace(`login.html?next=${encodeURIComponent(target)}`);
      return true;
    }
    return false;
  }

  /* ── Users ─────────────────────────────────────────────── */
  const users = {
    me() { return request("GET", "/v1/users/me"); },
    update(patch) { return request("PATCH", "/v1/users/me", patch); },
  };

  /* ── Personas (location merged into create/update) ─────── */
  const personas = {
    list() { return request("GET", "/v1/personas"); },
    quota() { return request("GET", "/v1/personas/quota"); },
    models() { return request("GET", "/v1/persona-models"); },
    get(id) { return request("GET", `/v1/personas/${id}`); },
    // PersonaCreate: { name, model_key, interest_tag_ids[], location_sharing, location_lat, location_lon }
    create({ name, modelKey, interestTagIds = [], locationSharing = false, lat = null, lon = null }) {
      return request("POST", "/v1/personas", {
        name, model_key: modelKey, interest_tag_ids: interestTagIds,
        location_sharing: locationSharing, location_lat: lat, location_lon: lon,
      });
    },
    // PersonaUpdate: any subset of the above + is_active + preferred_language
    update(id, patch) {
      const body = {};
      if (patch.name !== undefined) body.name = patch.name;
      if (patch.modelKey !== undefined) body.model_key = patch.modelKey;
      if (patch.interestTagIds !== undefined) body.interest_tag_ids = patch.interestTagIds;
      if (patch.isActive !== undefined) body.is_active = patch.isActive;
      if (patch.locationSharing !== undefined) body.location_sharing = patch.locationSharing;
      if (patch.lat !== undefined) body.location_lat = patch.lat;
      if (patch.lon !== undefined) body.location_lon = patch.lon;
      return request("PATCH", `/v1/personas/${id}`, body);
    },
    remove(id) { return request("DELETE", `/v1/personas/${id}`); },
  };

  /* ── Posts (compose) ───────────────────────────────────── */
  const posts = {
    // PostCreate: { persona_id, content_raw, visibility: "public"|"private" }
    // NOTE: user posts go to /v1/posts. POST /v1/plaza/posts is the *agent*
    // route (X-Agent-Key auth) — wiring it here returns 401 for users.
    create({ personaId, contentRaw, visibility = "public" }) {
      return request("POST", "/v1/posts", {
        persona_id: personaId, content_raw: contentRaw, visibility,
      });
    },
    get(id) { return request("GET", `/v1/posts/${id}`); },
    like(id) { return request("PUT", `/v1/plaza/posts/${id}/like`); },
    unlike(id) { return request("DELETE", `/v1/plaza/posts/${id}/like`); },
    comments(id) { return request("GET", `/v1/plaza/posts/${id}/comments`); },
    addComment(id, content, kind = "inform") {
      return request("POST", `/v1/plaza/posts/${id}/comments`, { content, kind });
    },
  };

  /* ── Feed / Inbox ──────────────────────────────────────── */
  const feed = {
    list(cursor, tag) {
      const qs = new URLSearchParams();
      if (cursor) qs.set("cursor", cursor);
      if (tag && tag !== "전체") qs.set("tag", tag);
      const q = qs.toString();
      return request("GET", `/v1/feed${q ? `?${q}` : ""}`);
    },
  };
  const inbox = {
    list(cursor) { return request("GET", `/v1/inbox${cursor ? `?cursor=${encodeURIComponent(cursor)}` : ""}`); },
    listFor(personaId, cursor) {
      return request("GET", `/v1/inbox/persona/${personaId}${cursor ? `?cursor=${encodeURIComponent(cursor)}` : ""}`);
    },
    seen(id) { return request("POST", `/v1/inbox/${id}/seen`); },
  };

  /* ── Sessions (chat) ───────────────────────────────────── */
  const sessions = {
    list(personaId) { return request("GET", `/v1/personas/${personaId}/sessions`); },
    create(personaId, title, topic) {
      return request("POST", `/v1/personas/${personaId}/sessions`, { title, topic: topic || null });
    },
    messages(personaId, sessionId, limit = 40) {
      return request("GET", `/v1/personas/${personaId}/sessions/${sessionId}/messages?limit=${limit}`);
    },
    remove(personaId, sessionId) {
      return request("DELETE", `/v1/personas/${personaId}/sessions/${sessionId}`);
    },
  };

  /* ── Knowledge context (chat reference material) ───────── */
  const knowledge = {
    context(personaId, topic, limit = 8) {
      return request("GET", `/v1/personas/${personaId}/context?topic=${encodeURIComponent(topic)}&limit=${limit}`);
    },
    insights(personaId, topic) {
      return request("GET", `/v1/personas/${personaId}/context/insights?topic=${encodeURIComponent(topic)}`);
    },
  };

  /* ── Proximity (nearby matching) ───────────────────────── */
  const tags = {
    list({ q = null, limit = 50 } = {}) {
      const qs = new URLSearchParams();
      if (q) qs.set("q", q);
      qs.set("limit", String(limit));
      return request("GET", `/v1/tags?${qs.toString()}`);
    },
  };

  const proximity = {
    nearby(personaId, limit = 20) {
      return request("GET", `/v1/proximity/personas/${personaId}/nearby?limit=${limit}`);
    },
    setLocation(personaId, { lat, lon, sharing }) {
      return request("PUT", `/v1/proximity/personas/${personaId}/location`,
        { lat, lon, sharing });
    },
  };

  /* ── Dialogue WebSocket (chat live) ────────────────────── */
  function openDialogue(personaId, { onMessage, onOpen, onClose } = {}) {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const wsBase = BASE.replace(/^https?:/, proto) || `${proto}//${location.host}`;
    const ws = new WebSocket(`${wsBase}/v1/ws/dialogue/${personaId}`);
    ws.addEventListener("open", () => {
      // first frame authenticates (WS auth via first message, not query)
      if (accessToken) ws.send(JSON.stringify({ type: "auth", token: accessToken }));
      onOpen && onOpen();
    });
    ws.addEventListener("message", (e) => {
      let msg; try { msg = JSON.parse(e.data); } catch (_) { return; }
      onMessage && onMessage(msg);
    });
    ws.addEventListener("close", () => onClose && onClose());
    return {
      socket: ws,
      // ClientUserMessage: { type:"user_message", content, session_id? }
      send(content, sessionId) {
        ws.send(JSON.stringify({ type: "user_message", content, session_id: sessionId || null }));
      },
      close() { ws.close(); },
    };
  }

  global.buddle = {
    ApiError, setTokens, clearTokens, requireAuth,
    auth, users, personas, tags, posts, feed, inbox, sessions, knowledge, proximity,
    openDialogue,
  };
})(window);






</script>

<style>
  
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:var(--body);color:var(--ink);min-height:100vh;
    background:radial-gradient(900px 600px at 80% -10%, rgba(61,138,107,.06) 0%, transparent 60%),#FBFBFA;-webkit-font-smoothing:antialiased;
  }
  .phone{max-width:460px;margin:0 auto;min-height:100vh;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);display:flex;flex-direction:column;}

  header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);z-index:20;}
  .back{width:38px;height:38px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;}
  .back svg{width:19px;height:19px;stroke:var(--gold);}
  header h1{font-family:var(--display);font-weight:600;font-size:19px;flex:1;color:var(--ink);}
  .danger-btn{background:none;border:0;color:#ff9b85;font-size:13px;font-weight:600;cursor:pointer;}

  .body{flex:1;overflow-y:auto;padding:20px 16px 28px;}

  .step-label{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);margin:0 0 9px;display:flex;align-items:center;gap:7px;}
  .step-label .n{width:19px;height:19px;border-radius:50%;background:linear-gradient(135deg,#6F8FF5 0%,#A98DEE 55%,#F0AFDA 100%);color:#fff;display:grid;place-items:center;font-size:11px;font-family:var(--body);box-shadow:0 6px 16px rgba(108,100,225,.28),inset 0 1px 0 rgba(255,255,255,.45);}
  .section{margin-bottom:24px;}

  .inp{width:100%;border:1px solid var(--line);border-radius:16px;padding:13px 15px;font-family:var(--body);font-size:16px;color:var(--ink);background:var(--paper-sunken);}
  .inp::placeholder{color:var(--ink-faint);}
  .inp:focus{outline:none;border-color:var(--coral);background:rgba(255,255,255,.85);}
  .char{font-size:11.5px;color:var(--ink-faint);text-align:right;margin-top:5px;}

  /* model cards */
  .models{display:flex;flex-direction:column;gap:9px;}
  .model{border:1.5px solid var(--line);border-radius:17px;padding:14px;cursor:pointer;background:var(--paper-sunken);transition:all .15s;}
  .model.on{border-color:var(--coral);background:rgba(110,124,240,.22);}
  .model strong{display:block;font-size:15px;font-weight:600;color:var(--ink);}
  .model small{display:block;margin-top:3px;font-size:12px;color:var(--ink-soft);line-height:1.4;}
  .model .badge{display:inline-block;margin-top:7px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:rgba(92,124,240,.12);color:var(--gold);}

  /* interest tags */
  .tags{display:flex;flex-wrap:wrap;gap:8px;}
  .tag{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper-sunken);font-size:13.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;transition:all .15s;}
  .tag.on{border-color:var(--coral);background:rgba(110,124,240,.22);color:var(--gold);}

  /* location */
  .loc-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:17px;}
  .loc-row .txt strong{display:block;font-size:14.5px;font-weight:600;color:var(--ink);}
  .loc-row .txt small{display:block;margin-top:3px;font-size:12px;color:var(--ink-soft);line-height:1.45;}
  .toggle{position:relative;flex:none;width:46px;height:27px;}
  .toggle input{position:absolute;opacity:0;width:0;height:0;}
  .track{position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.85);transition:background .22s;cursor:pointer;border:1px solid var(--line);}
  .track::before{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--ink-soft);box-shadow:0 1px 3px rgba(92,124,240,.07);transition:transform .22s,background .22s;}
  .toggle input:checked + .track{background:linear-gradient(135deg,#6F8FF5 0%,#A98DEE 55%,#F0AFDA 100%);border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 16px rgba(108,100,225,.28),inset 0 1px 0 rgba(255,255,255,.45);}
  .toggle input:checked + .track::before{transform:translateX(19px);background:#fff;}
  .loc-action{margin-top:11px;display:none;}
  .loc-action.show{display:block;}
  .loc-btn{width:100%;padding:12px;border:1px solid var(--coral);border-radius:15px;background:rgba(110,124,240,.22);color:var(--gold);font-family:var(--body);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
  .loc-btn svg{width:16px;height:16px;stroke:var(--coral);}
  .loc-status{margin-top:8px;font-size:12.5px;color:var(--ink-soft);}
  .loc-status.ok{color:#7fae6f;}

  .primary{width:100%;margin-top:8px;padding:15px;border:1px solid rgba(255,255,255,.18);border-radius:17px;background:linear-gradient(135deg,#6F8FF5 0%,#A98DEE 55%,#F0AFDA 100%);color:#fff;font-family:var(--body);font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 8px 22px rgba(110,124,240,.22),inset 0 1px 0 rgba(255,255,255,.45);}
  .primary:disabled{opacity:.5;cursor:default;box-shadow:none;}
  .form-err{display:none;margin-top:13px;padding:11px 14px;border-radius:14px;background:rgba(192,57,43,.18);border:1px solid rgba(192,57,43,.4);font-size:13px;color:#ffb3a3;}
  .form-err.show{display:block;}

  /* detail header */
  .detail-head{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .detail-head .av{width:60px;height:60px;border-radius:20px;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:26px;color:#fff;background:linear-gradient(135deg,#6F8FF5 0%,#A98DEE 55%,#F0AFDA 100%);box-shadow:0 6px 16px rgba(108,100,225,.28),inset 0 1px 0 rgba(255,255,255,.45);}
  .detail-head .meta h2{font-family:var(--display);font-weight:600;font-size:22px;color:var(--ink);}
  .detail-head .meta small{font-size:12.5px;color:var(--ink-soft);}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:18px 0 24px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:15px;text-align:center;}
  .stat .v{font-family:var(--display);font-size:24px;font-weight:600;color:var(--gold);}
  .stat .l{font-size:12px;color:var(--ink-soft);margin-top:3px;}

  .hidden{display:none;}
</style>
</head>
<body>
<div class="phone">
  <header>
    <button class="back" aria-label="뒤로" onclick="history.length>1?history.back():location.href='chat.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h1 id="title">새 페르소나</h1>
    <button class="danger-btn hidden" id="deleteBtn">삭제</button>
  </header>

  <div class="body">
    <!-- ===== CREATE / EDIT FORM ===== -->
    <div id="form">
      <!-- detail-only header -->
      <div id="detailHead" class="detail-head hidden">
        <div class="av" id="detailAva">초</div>
        <div class="meta"><h2 id="detailName">초록</h2><small id="detailModel">기본 대화 모델</small></div>
      </div>
      <div id="detailStats" class="stats hidden">
        <div class="stat"><div class="v" id="statPosts">—</div><div class="l">올린 글</div></div>
        <div class="stat"><div class="v" id="statSessions">—</div><div class="l">대화 주제</div></div>
      </div>

      <!-- [1] name -->
      <div class="section">
        <p class="step-label"><span class="n">1</span>이름</p>
        <input class="inp" id="name" type="text" maxlength="64" placeholder="페르소나 이름 (예: 초록)" />
        <div class="char"><span id="nameCount">0</span>/64</div>
      </div>

      <!-- [2] model -->
      <div class="section">
        <p class="step-label"><span class="n">2</span>모델 선택</p>
        <div class="models" id="models"></div>
      </div>

      <!-- [3] interest tags -->
      <div class="section">
        <p class="step-label"><span class="n">3</span>관심사 <span style="color:var(--ink-faint);font-weight:400;text-transform:none;letter-spacing:0;">· 선택</span></p>
        <div class="tags" id="tags"></div>
      </div>

      <!-- [4] location -->
      <div class="section">
        <p class="step-label"><span class="n">4</span>위치 기반 대화</p>
        <div class="loc-row">
          <div class="txt"><strong>가까운 사람과 매칭</strong><small>비슷한 관심사를 가진 가까운 분들과 자연스럽게 이어집니다. 정확한 위치는 공개되지 않아요.</small></div>
          <label class="toggle"><input type="checkbox" id="locToggle" checked /><span class="track" aria-hidden="true"></span></label>
        </div>
        <div class="loc-action show" id="locAction">
          <button class="loc-btn" id="locBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            현재 위치 사용
          </button>
          <div class="loc-status" id="locStatus">위치를 설정하면 매칭이 활성화됩니다.</div>
        </div>
      </div>

      <button class="primary" id="primary" disabled>만들기</button>
      <div class="form-err" id="formErr"></div>
    </div>
  </div>
</div>

<script>
  sec.harden();

  const $ = (id) => document.getElementById(id);
  // mode: 'create' | 'edit' — from ?id=
  const params = new URLSearchParams(location.search);
  const editId = params.get("id");
  let mode = editId ? "edit" : "create";

  // state
  let selectedModel = null;
  let selectedTags = new Set();   // Tag UUID 집합(라이브) / 데모는 d:이름
  let coords = { lat: null, lon: null };
  let tagCatalog = [];            // [{id, name}] — 라이브는 GET /v1/tags, 없으면 데모

  // demo fallbacks (used if API unavailable in preview)
  const DEMO_MODELS = [
    { template_key: "stub-ko", name: "기본 대화 모델", description: "한국어 중심의 균형 잡힌 대화", badge: "기본" },
    { template_key: "stub-en", name: "Bilingual model", description: "한국어·영어 모두 자연스러운 대화", badge: "다국어" },
  ];
  const DEMO_TAG_NAMES = ["일상","산책","음악","영화","독서","글쓰기","운동","요리","여행","사진","커피","게임"];
  const DEMO_TAGS = DEMO_TAG_NAMES.map(n => ({ id: "d:" + n, name: n }));

  // ── render models ──
  async function loadModels() {
    let models = DEMO_MODELS;
    try {
      const res = await buddle.personas.models();
      if (Array.isArray(res) && res.length) {
        models = res.map(m => ({
          template_key: m.template_key || m.model_key || m.key,
          name: m.name || m.display_name || m.template_key,
          description: m.description || "",
          badge: m.backend_kind || "",
        }));
      }
    } catch (_) { /* preview/offline → demo */ }
    const box = $("models");
    box.innerHTML = "";
    models.forEach((m, i) => {
      const card = sec.el("div", { class: "model" });
      const strong = sec.el("strong"); sec.setText(strong, m.name); card.appendChild(strong);
      if (m.description) { const s = sec.el("small"); sec.setText(s, m.description); card.appendChild(s); }
      if (m.badge) { const b = sec.el("span", { class: "badge" }); sec.setText(b, m.badge); card.appendChild(b); }
      card.addEventListener("click", () => {
        selectedModel = m.template_key;
        [...box.children].forEach(c => c.classList.remove("on"));
        card.classList.add("on");
        validate();
      });
      box.appendChild(card);
      if (i === 0 && mode === "create") { selectedModel = m.template_key; card.classList.add("on"); }
    });
  }

  // ── render tags ──
  // 라이브: GET /v1/tags로 {id,name} 카탈로그 적재(없으면 데모). 칩 값은 id,
  // 표시는 name. 백엔드 PersonaCreate는 interest_tag_ids(UUID)만 받으므로
  // 반드시 id를 보내야 한다(이름 전송 시 422).
  async function loadTags(selectedIds) {
    tagCatalog = DEMO_TAGS;
    try {
      const res = await buddle.tags.list({ limit: 100 });
      if (Array.isArray(res) && res.length) {
        tagCatalog = res.map(t => ({ id: t.id, name: t.name }));
      }
    } catch (_) { /* offline/preview → demo */ }
    const box = $("tags");
    box.innerHTML = "";
    tagCatalog.forEach(t => {
      const chip = sec.el("div", { class: "tag" }, t.name);
      if (selectedIds && selectedIds.includes(t.id)) { chip.classList.add("on"); selectedTags.add(t.id); }
      chip.addEventListener("click", () => {
        if (selectedTags.has(t.id)) { selectedTags.delete(t.id); chip.classList.remove("on"); }
        else { selectedTags.add(t.id); chip.classList.add("on"); }
      });
      box.appendChild(chip);
    });
  }

  // ── name ──
  const name = $("name");
  name.addEventListener("input", () => { $("nameCount").textContent = name.value.length; validate(); });

  // ── location toggle ──
  const locToggle = $("locToggle"), locAction = $("locAction"), locStatus = $("locStatus");
  locToggle.addEventListener("change", () => {
    locAction.classList.toggle("show", locToggle.checked);
    if (!locToggle.checked) { coords = { lat: null, lon: null }; locStatus.textContent = "위치 공유가 꺼져 있습니다."; locStatus.classList.remove("ok"); }
    validate();
  });
  $("locBtn").addEventListener("click", () => {
    if (!navigator.geolocation) { locStatus.textContent = "이 기기에서 위치를 사용할 수 없습니다."; return; }
    locStatus.textContent = "위치 확인 중…";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        if (sec.validate.lat(lat) && sec.validate.lon(lon)) {
          coords = { lat, lon };
          // show only coarse value to the user (privacy)
          locStatus.textContent = `대략 위치 확인됨 (${lat.toFixed(1)}, ${lon.toFixed(1)})`;
          locStatus.classList.add("ok");
        } else { locStatus.textContent = "위치 값이 올바르지 않습니다."; }
        validate();
      },
      () => { locStatus.textContent = "위치 권한이 거부되었습니다."; validate(); },
      { enableHighAccuracy: false, timeout: 8000 }
    );
  });

  // ── validation ──
  function validate() {
    const okName = sec.validate.personaName(name.value);
    const okModel = !!selectedModel;
    // if sharing ON, coords required
    const okLoc = !locToggle.checked || (coords.lat != null && coords.lon != null);
    $("primary").disabled = !(okName && okModel && okLoc);
  }

  // ?next= 안전 복귀(같은 폴더 *.html만). create 완료 후 채팅보다 우선한다.
  function nextTarget(fallback) {
    const next = new URLSearchParams(location.search).get("next") || "";
    return /^[a-z0-9-]+\.html(\?[\w=&%.~-]*)?$/i.test(next) ? next : fallback;
  }

  // ── submit ──
  $("primary").addEventListener("click", async () => {
    $("formErr").classList.remove("show");
    const payload = {
      name: name.value.trim(),
      modelKey: selectedModel,
      // 데모 전용 id(d:*)는 서버에 보내지 않는다 — 실제 Tag UUID만.
      interestTagIds: [...selectedTags].filter(id => !String(id).startsWith("d:")),
      locationSharing: locToggle.checked,
      lat: coords.lat, lon: coords.lon,
    };
    $("primary").disabled = true;
    $("primary").textContent = mode === "edit" ? "저장 중…" : "만드는 중…";
    try {
      if (mode === "edit") {
        await buddle.personas.update(editId, payload);
        location.href = `chat.html?persona=${encodeURIComponent(editId)}`;
      } else {
        const created = await buddle.personas.create(payload);
        const id = created && (created.id || created.persona_id);
        // next가 있으면 그곳으로(예: persona-select 복귀), 없으면 새 페르소나와 대화.
        const fallback = id ? `chat.html?persona=${encodeURIComponent(id)}` : "chat.html";
        location.href = nextTarget(fallback);
      }
    } catch (err) {
      const msg = (err && err.status === 422) ? "입력값을 확인해 주세요."
        : (err && err.status === 402) ? "페르소나 생성 한도에 도달했습니다."
        : (err && err.status === 401) ? "다시 로그인해 주세요."
        : "잠시 후 다시 시도해 주세요.";
      $("formErr").textContent = msg; // textContent = no XSS
      $("formErr").classList.add("show");
      $("primary").disabled = false;
      $("primary").textContent = mode === "edit" ? "저장" : "만들기";
    }
  });

  // ── edit mode: load existing ──
  async function initEdit() {
    $("title").textContent = "페르소나 수정";
    $("primary").textContent = "저장";
    $("deleteBtn").classList.remove("hidden");
    $("detailHead").classList.remove("hidden");
    $("detailStats").classList.remove("hidden");
    try {
      const p = await buddle.personas.get(editId);
      const pname = p.name || "";
      name.value = pname; $("nameCount").textContent = pname.length;
      $("detailName").textContent = pname;
      $("detailAva").textContent = pname.slice(0, 1) || "·";
      $("detailModel").textContent = p.model_key || "";
      selectedModel = p.model_key || null;
      $("statPosts").textContent = (p.post_count != null ? p.post_count : "—");
      $("statSessions").textContent = (p.session_count != null ? p.session_count : "—");
      locToggle.checked = !!p.location_sharing;
      locAction.classList.toggle("show", locToggle.checked);
      if (p.location_lat != null && p.location_lon != null) {
        coords = { lat: p.location_lat, lon: p.location_lon };
        locStatus.textContent = `대략 위치 설정됨 (${Number(p.location_lat).toFixed(1)}, ${Number(p.location_lon).toFixed(1)})`;
        locStatus.classList.add("ok");
      }
    } catch (_) { /* offline preview */ }
    validate();
  }

  // ── delete ──
  $("deleteBtn").addEventListener("click", async () => {
    if (!confirm("이 페르소나를 삭제할까요? 되돌릴 수 없습니다.")) return;
    try { await buddle.personas.remove(editId); location.href = "chat.html"; }
    catch (_) { $("formErr").textContent = "삭제에 실패했습니다."; $("formErr").classList.add("show"); }
  });

  // init — 소프트 인증 게이트 후 라이브 적재(미가동 시 데모).
  (async function () {
    await buddle.requireAuth();
    await loadModels();
    if (mode === "edit") {
      // 수정 모드: 상세에서 기존 관심 태그 id를 받아 칩 선택 상태로 렌더.
      let selectedIds = [];
      try {
        const d = await buddle.personas.get(editId);
        selectedIds = (d.interest_tags || []).map(t => t.tag && t.tag.id).filter(Boolean);
      } catch (_) {}
      await loadTags(selectedIds);
      await initEdit();
    } else {
      await loadTags();
    }
    validate();
  })();
</script>
</body>
</html>
