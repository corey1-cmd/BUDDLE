<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>버들 — 프로필</title>
<link rel="stylesheet" href="buddle.css">
<style>
  /* ── 인스타식 프로필: 헤더(아바타·통계) + 내 글 목록(글이라 한 줄에 1개) ── */
  .ph{display:flex;align-items:center;gap:var(--s4);margin:var(--s2) 0 var(--s4);}
  .ph .ava{width:76px;height:76px;border-radius:26px;flex:none;display:grid;place-items:center;
    font-family:var(--display);font-weight:700;font-size:30px;color:#fff;background:var(--accent-grad);
    border:1px solid rgba(255,255,255,.18);box-shadow:var(--shadow-pop-sm);}
  .ph .stats{flex:1;display:flex;justify-content:space-around;text-align:center;}
  .ph .stat b{display:block;font-family:var(--display);font-size:19px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
  .ph .stat span{font-size:var(--t-xs);color:var(--ink-soft);}
  .ph-name{margin-bottom:var(--s4);}
  .ph-name b{display:block;font-family:var(--display);font-size:17px;font-weight:700;color:var(--ink);}
  .ph-name span{font-size:var(--t-xs);color:var(--ink-faint);}

  /* 액션 버튼 2개 — 인스타의 '프로필 편집 / 프로필 공유' 자리 */
  .ph-actions{display:flex;gap:var(--s2);margin-bottom:var(--s5);}
  .ph-actions a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:38px;
    border-radius:12px;border:1px solid var(--line);background:var(--paper-raised);
    font-size:var(--t-sm);font-weight:600;color:var(--ink);text-decoration:none;transition:background var(--dur) var(--ease);}
  .ph-actions a:hover{background:var(--paper-sunken);}
  .ph-actions svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;}

  /* 목록 시작 구분선 — 인스타 탭바 위치 (글 전용이라 탭은 1개) */
  .ph-tab{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 0;margin:0 calc(-1 * var(--s4)) var(--s4);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    font-size:var(--t-xs);font-weight:700;color:var(--ink-soft);letter-spacing:.06em;}
  .ph-tab svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;}

  /* 내 글 — 한 줄에 하나 (3열 그리드는 글 가시성이 죽는다) */
  .mypost{background:linear-gradient(158deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,.02) 40%,transparent 62%),var(--paper-raised);
    border:1px solid var(--line);border-radius:18px;padding:14px 15px;margin-bottom:12px;cursor:pointer;
    box-shadow:0 6px 22px rgba(23,26,60,.08),inset 0 1px 0 rgba(255,255,255,.10);
    backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
    transition:transform .12s,border-color .15s;}
  .mypost:hover{border-color:var(--line-strong);}
  .mypost:active{transform:scale(.99);}
  .mp-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .mp-persona{font-size:13px;font-weight:600;color:var(--ink);}
  .mp-time{font-size:11.5px;color:var(--ink-faint);}
  .mp-badge{margin-left:auto;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;
    background:var(--paper-sunken);color:var(--ink-faint);}
  .mp-badge.warn{background:var(--caution-wash);color:var(--caution);}
  .mp-body{font-size:14.5px;line-height:1.6;color:var(--ink);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;}
  .mp-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
  .mp-tag{font-size:11px;font-weight:600;color:var(--willow-text);background:var(--willow-wash);border-radius:999px;padding:2px 9px;}
  .mp-foot{display:flex;align-items:center;gap:16px;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .mp-foot .it{display:flex;align-items:center;gap:5px;}
  .mp-foot svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;}

  .ph-empty{text-align:center;color:var(--ink-faint);font-size:14px;line-height:1.7;padding:44px 20px;}
  .ph-empty a{color:var(--willow-text);font-weight:700;text-decoration:none;}
  .ph-loading{text-align:center;color:var(--ink-faint);font-size:14px;padding:40px 0;}
  .ph-more{width:100%;margin:2px 0 8px;padding:12px;border:1px solid var(--line);border-radius:14px;
    background:var(--paper-raised);color:var(--willow-text);font-family:var(--body);font-size:14px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
<div class="bd-phone">

  <div class="bd-top">
    <h1 style="flex:1;font-family:var(--display);font-weight:700;font-size:20px">프로필</h1>
    <a class="bd-iconbtn" href="bookmarks.html" aria-label="저장한 글" title="저장한 글">
      <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    </a>
    <a class="bd-iconbtn" href="notifications.html" aria-label="알림" title="알림">
      <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    </a>
  </div>

  <!-- 인스타식 헤더: 아바타 + 통계(게시물 · 받은 좋아요 · 받은 댓글) -->
  <div class="ph bd-reveal">
    <div class="ava" id="phAva">·</div>
    <div class="stats">
      <div class="stat"><b id="stPosts">0</b><span>게시물</span></div>

    </div>
  </div>
  <div class="ph-name bd-reveal">
    <b id="phHandle">…</b>
    <span id="phSub">버들에서 생각을 나누는 중</span>
  </div>

  <div class="ph-actions bd-reveal">
    <a href="profile-traits.html">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      성향 프로파일
    </a>
    <a href="compose.html">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      새 글 쓰기
    </a>
  </div>

  <div class="ph-tab bd-reveal">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    내 글
  </div>

  <div id="myPosts"><div class="ph-loading">불러오는 중…</div></div>

</div>

<!-- bottom nav (Instagram식 5슬롯: 홈·관심주제·글쓰기(중앙)·내활동·프로필) -->

<script src="buddle.ux.js"></script>
<script>
/* ── 최소 보안 헬퍼 (SECURITY_FRONTEND 규약 부분집합: API 텍스트는 DOM API로만) ── */
function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = String(text);
  return n;
}

/* ── 최소 API (api.js 규약 부분집합: sessionStorage 토큰 buddle.auth.v1, Bearer) ── */
const api = (() => {
  const BASE = window.BUDDLE_API_BASE || "";
  const TOKEN_KEY = "buddle.auth.v1";
  function token(){
    try{
      const raw = sessionStorage.getItem(TOKEN_KEY);
      return raw ? (JSON.parse(raw).a || null) : null;
    }catch{ return null; }
  }
  async function call(method, path){
    const headers = { "Accept": "application/json" };
    const t = token();
    if (t) headers["Authorization"] = "Bearer " + t;
    const res = await fetch(BASE + path, { method, headers });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }
  return {
    hasToken: () => !!token(),
    me: () => call("GET", "/v1/users/me"),
    myPosts: (cursor) => call("GET", "/v1/posts?limit=20" + (cursor ? "&cursor=" + encodeURIComponent(cursor) : "")),
  };
})();

const $ = (id) => document.getElementById(id);

function relTime(iso){
  if(!iso) return "방금";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if(s < 60) return "방금";
  if(s < 3600) return `${Math.floor(s/60)}분 전`;
  if(s < 86400) return `${Math.floor(s/3600)}시간 전`;
  return `${Math.floor(s/86400)}일 전`;
}
function fmt(n){ return n >= 10000 ? (n/10000).toFixed(1).replace(/\.0$/,"") + "만" : String(n); }
function tagName(t){ return (t && typeof t === "object") ? (t.name || "") : String(t || ""); }

/* 한 줄 글 카드 — 인스타 그리드 대신 가독성 우선(글이니까) */
function postRow(item){
  const card = el("div", "mypost");
  const head = el("div", "mp-head");
  head.appendChild(el("span", "mp-persona", (item.source_persona && item.source_persona.name) || "나"));
  head.appendChild(el("span", "mp-time", "· " + relTime(item.created_at)));
  if (item.is_suppressed) head.appendChild(el("span", "mp-badge warn", "검토중"));
  else if (item.visibility === "private") head.appendChild(el("span", "mp-badge", "비공개"));
  card.appendChild(head);
  card.appendChild(el("div", "mp-body", item.content_transformed || ""));
  const tags = (item.tags || []).map(tagName).filter(Boolean);
  if (tags.length){
    const tb = el("div", "mp-tags");
    tags.slice(0, 4).forEach(t => tb.appendChild(el("span", "mp-tag", "#" + t)));
    card.appendChild(tb);
  }
  const foot = el("div", "mp-foot");
  const like = el("span", "it");
  like.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20.8 7.6a5 5 0 0 0-7.1 0L12 9.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 23l8.8-8.3a5 5 0 0 0 0-7.1z"/></svg>';
  like.appendChild(document.createTextNode(" " + fmt(item.like_count || 0)));
  const cmt = el("span", "it");
  cmt.innerHTML = '<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
  cmt.appendChild(document.createTextNode(" " + fmt(item.comment_count || 0)));
  foot.append(like, cmt);
  card.appendChild(foot);
  card.addEventListener("click", () => {
    // 상세는 피드와 같은 스태시 규약 — MyPostItem 필드가 feed item과 호환된다.
    try { sessionStorage.setItem("buddle.feed.item." + item.id, JSON.stringify(item)); } catch(_){}
    location.href = "feed.html?post=" + encodeURIComponent(item.id);
  });
  return card;
}

let nextCursor = null;
async function loadPosts(cursor){
  const box = $("myPosts");
  if(!cursor) box.replaceChildren(el("div", "ph-loading", "불러오는 중…"));
  let page = null;
  try { page = await api.myPosts(cursor || null); }
  catch(_){
    box.replaceChildren(el("div", "ph-empty", "글을 불러오지 못했어요. 잠시 후 다시 시도해 주세요."));
    return;
  }
  // 헤더 통계 — 전체 합계(서버 집계)
  $("stPosts").textContent = fmt(page.post_count || 0);
  $("stLikes").textContent = fmt(page.like_count || 0);
  $("stComments").textContent = fmt(page.comment_count || 0);
  nextCursor = page.next_cursor || null;

  if(!cursor) box.replaceChildren();
  const oldMore = $("phMore"); if (oldMore) oldMore.remove();
  const items = page.items || [];
  if(!cursor && !items.length){
    const empty = el("div", "ph-empty");
    empty.appendChild(document.createTextNode("아직 쓴 글이 없어요."));
    empty.appendChild(document.createElement("br"));
    const a = el("a", null, "가운데 글쓰기에서 첫 생각을 남겨보세요 →");
    a.href = "compose.html";
    empty.appendChild(a);
    box.appendChild(empty);
    return;
  }
  items.forEach(it => box.appendChild(postRow(it)));
  if (nextCursor){
    const more = el("button", "ph-more", "더 보기");
    more.id = "phMore";
    more.addEventListener("click", () => loadPosts(nextCursor));
    box.appendChild(more);
  }
}

(async function boot(){
  if (!api.hasToken()){ location.href = "login.html"; return; }
  try {
    const me = await api.me();
    const handle = (me.email || "").split("@")[0] || "나";
    $("phHandle").textContent = handle;
    $("phAva").textContent = handle.slice(0, 1).toUpperCase();
    $("phSub").textContent = me.is_admin ? "관리자 · 버들에서 생각을 나누는 중" : "버들에서 생각을 나누는 중";
  } catch(_){ /* 토큰 만료 등 — 목록 호출이 다시 판정 */ }
  loadPosts();
})();
</script>
</body>
</html>
