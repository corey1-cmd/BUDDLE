<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>buddle · 대화</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="buddle.css">
<style>
  
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--body);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;}
  .phone{max-width:460px;margin:0 auto;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);min-height:100vh;display:flex;flex-direction:column;position:relative;}

  /* top bar */
  header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);z-index:20;}
  .back{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--white);display:grid;place-items:center;cursor:pointer;flex:none;}
  .back svg{width:19px;height:19px;stroke:var(--forest);}
  .head-persona{display:flex;align-items:center;gap:8px;flex:1;min-width:0;background:transparent;border:0;cursor:pointer;padding:4px 8px 4px 4px;border-radius:12px;text-align:left;transition:background .15s;}
  .head-persona:hover{background:var(--paper-sunken);}
  .head-ava{width:38px;height:38px;border-radius:14px;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:17px;color:#fff;background:var(--grad-rich2);border:0;box-shadow:0 5px 14px rgba(108,100,225,.28),inset 0 1px 0 rgba(255,255,255,.45);}
  .head-text{min-width:0;}
  .head-text h1{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:5px;}
  .head-text h1 .chev{width:15px;height:15px;stroke:var(--ink-faint);flex:none;}
  .head-text small{font-size:12px;color:var(--forest-300);}
  /* relationship indicator — quiet, not gamified: willow leaves that fill as
     the Social-Penetration level rises, with a gentle stage label. */
  .rel-line{display:flex;align-items:center;gap:6px;}
  .rel-leaves{display:inline-flex;gap:2px;}
  .rel-leaves i{width:9px;height:9px;border-radius:0 50% 50% 50%;transform:rotate(45deg);
    background:var(--line-strong);transition:background var(--dur,.22s) var(--ease,ease);}
  .rel-leaves i.on{background:var(--willow);}
  #relLabel{color:var(--ink-faint);font-size:11px;}
  .gear{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--white);display:grid;place-items:center;cursor:pointer;flex:none;}
  .gear svg{width:19px;height:19px;stroke:var(--forest);}

  /* persona picker — Claude식 모델 선택 드롭다운 (대화 중 페르소나 전환) */
  .pp-backdrop{position:fixed;inset:0;z-index:30;background:transparent;}
  .pp-menu{position:absolute;top:60px;left:16px;z-index:31;width:min(320px,calc(100% - 32px));background:var(--paper-raised);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:8px;animation:ppIn .18s var(--ease,ease);}
  @keyframes ppIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
  .pp-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding:8px 10px 6px;}
  .pp-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px;border:0;background:transparent;border-radius:12px;cursor:pointer;text-align:left;transition:background .14s;}
  .pp-item:hover{background:var(--paper-sunken);}
  .pp-item.on{background:var(--willow-wash);}
  .pp-ava{width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:16px;color:#fff;background:var(--accent-grad);box-shadow:var(--shadow-pop-sm);}
  .pp-meta{flex:1;min-width:0;}
  .pp-meta strong{display:block;font-size:14.5px;font-weight:600;color:var(--ink);}
  .pp-meta small{display:block;font-size:12px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pp-check{width:18px;height:18px;flex:none;stroke:var(--willow);opacity:0;}
  .pp-item.on .pp-check{opacity:1;}
  .pp-new{display:flex;align-items:center;gap:11px;width:100%;padding:11px 10px;border:0;border-top:1px solid var(--line);margin-top:4px;background:transparent;cursor:pointer;text-align:left;color:var(--willow-press);font-family:var(--body);font-size:14px;font-weight:600;border-radius:0 0 12px 12px;}
  .pp-new:hover{background:var(--paper-sunken);}
  .pp-new .pp-plus{width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;border:1.5px dashed var(--line-strong);}
  .pp-new .pp-plus svg{width:17px;height:17px;stroke:var(--willow);}

  /* session strip (topic threads) */
  .sessions{display:flex;gap:8px;overflow-x:auto;padding:11px 16px;border-bottom:1px solid var(--line);scrollbar-width:none;}
  .sessions::-webkit-scrollbar{display:none;}
  .schip{flex:none;padding:8px 14px;border-radius:999px;background:var(--cream);border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;white-space:nowrap;transition:all .15s;}
  .schip.on{background:linear-gradient(135deg,#6F8FF5 0%,#A98DEE 55%,#F0AFDA 100%);color:#fff;border:1px solid transparent;box-shadow:0 6px 16px rgba(108,100,225,.28),inset 0 1px 0 rgba(255,255,255,.4);}
  .schip.new{border-style:dashed;border-color:var(--forest-300);color:var(--forest);display:flex;align-items:center;gap:5px;}
  .schip.new svg{width:13px;height:13px;stroke:var(--forest);}

  /* messages */
  .msgs{flex:1;overflow-y:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;gap:9px;max-width:86%;}
  .row.me{align-self:flex-end;flex-direction:row-reverse;}
  .bubble{padding:12px 16px;border-radius:20px;font-size:15px;line-height:1.5;}
  .row.persona .bubble{background:var(--paper-sunken);border:1px solid var(--line);border-radius:20px;border-bottom-left-radius:7px;color:var(--ink);box-shadow:var(--shadow-sm);}
  .row.me .bubble{background:var(--grad-rich);color:#fff;border-radius:20px;border-bottom-right-radius:7px;border:0;box-shadow:0 10px 24px rgba(108,100,225,.28),0 2px 8px rgba(92,124,240,.07),inset 0 1px 0 rgba(255,255,255,.4);}

  /* "근거로 추가" — 메시지 바로 아래, 대화를 토론으로 잇는 다리 */
  .msgwrap{display:flex;flex-direction:column;max-width:78%;}
  .row.me .msgwrap{align-items:flex-end;}
  .row.persona .msgwrap{align-items:flex-start;}
  .ground-add{display:flex;align-items:center;gap:4px;margin-top:5px;padding:4px 10px 4px 6px;border:0;background:transparent;color:var(--ink-faint);font-family:var(--body);font-size:11.5px;font-weight:600;cursor:pointer;border-radius:999px;transition:background .15s,color .15s;}
  .ground-add:hover{background:var(--willow-wash);color:var(--willow-press);}
  .ground-add svg{width:12px;height:12px;stroke:currentColor;flex:none;}

  /* 근거 추가 바텀시트 — 토론 대시보드와 동일한 시각 패턴 재사용 */
  .gsheet-backdrop{position:fixed;inset:0;background:rgba(40,38,60,.32);z-index:50;backdrop-filter:blur(2px);}
  .gsheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--paper);border-radius:22px 22px 0 0;padding:var(--s3) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(40,38,60,.18);max-width:520px;margin:0 auto;animation:gsheetUp .26s var(--ease,ease);}
  @keyframes gsheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .gsheet-handle{width:38px;height:4px;border-radius:99px;background:var(--line-strong);margin:0 auto var(--s4);}
  .gsheet-title{font-family:var(--display);font-weight:600;font-size:var(--t-h2);color:var(--ink);margin-bottom:4px;text-align:center;}
  .gsheet-sub{font-size:12.5px;color:var(--ink-faint);text-align:center;margin-bottom:var(--s4);}
  .gstance-pick{display:flex;gap:8px;margin-bottom:var(--s4);}
  .gsp{flex:1;padding:11px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--paper-raised);font-family:var(--body);font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .2s ease;}
  .gsp.con.on{border-color:var(--caution);background:#f9ece5;color:#9a5a38;}
  .gsp.neu.on{border-color:var(--line-strong);background:var(--paper-sunken);color:var(--ink);}
  .gsp.pro.on{border-color:var(--pos);background:var(--pos-wash);color:#2A6B51;}
  .gfield{display:block;margin-bottom:var(--s4);}
  .gfield span{display:block;font-size:var(--t-sm);font-weight:600;color:var(--ink-soft);margin-bottom:7px;}
  .gfield textarea{width:100%;border:1px solid var(--line-strong);border-radius:var(--r);padding:11px 13px;font-family:var(--body);font-size:14.5px;line-height:1.45;color:var(--ink);background:var(--paper-raised);resize:none;}
  .gfield textarea:focus{outline:none;border-color:var(--willow);box-shadow:0 0 0 3px var(--willow-ring);}
  .gsheet-actions{display:flex;gap:10px;margin-top:var(--s2);}
  .gbtn-ghost{flex:1;padding:13px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--paper-raised);font-family:var(--body);font-size:14.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .gbtn-fill{flex:2;padding:13px;border-radius:var(--r);border:0;background:var(--accent-grad);color:#fff;font-family:var(--body);font-size:14.5px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-pop-sm);}
  .gbtn-fill:disabled{opacity:.5;}
  .gtoast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:52;background:var(--ink);color:#fff;font-size:13.5px;font-weight:500;padding:11px 18px;border-radius:999px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;}
  .gtoast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .gtoast a{color:#cdd6ff;font-weight:700;text-decoration:underline;}
  .m-ava{width:30px;height:30px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:13px;color:#fff;background:var(--grad-rich2);align-self:flex-end;border:0;box-shadow:0 4px 12px rgba(108,100,225,.28),inset 0 1px 0 rgba(255,255,255,.45);}

  /* reference material (collapsible, knowledge space) */
  .refblock{align-self:flex-start;max-width:92%;border:1px solid var(--line);border-radius:14px;background:var(--white);overflow:hidden;}
  .ref-head{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--forest);}
  .ref-head .ic{width:16px;height:16px;stroke:var(--forest-300);}
  .ref-head .chev{margin-left:auto;width:16px;height:16px;stroke:var(--ink-faint);transition:transform .2s;}
  .refblock.open .chev{transform:rotate(180deg);}
  .ref-body{display:none;padding:0 14px 12px;}
  .refblock.open .ref-body{display:block;}
  .ref-item{font-size:13px;color:var(--ink-soft);padding:7px 0;border-top:1px solid var(--line);line-height:1.45;}
  .ref-item.insight{color:var(--forest-700);font-weight:500;}

  /* composer */
  .composer{display:flex;align-items:flex-end;gap:9px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--white);}
  .composer .plus{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--white);display:grid;place-items:center;cursor:pointer;flex:none;}
  .composer .plus svg{width:20px;height:20px;stroke:var(--forest);}
  .composer textarea{flex:1;border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-family:var(--body);font-size:15px;resize:none;max-height:120px;line-height:1.4;color:var(--ink);background:var(--cream);}
  .composer textarea:focus{outline:none;border-color:var(--forest-300);background:var(--white);}
  .send{width:44px;height:44px;border-radius:15px;border:0;background:var(--grad-rich);box-shadow:0 6px 16px rgba(110,124,240,.22),inset 0 1px 0 rgba(255,255,255,.45);display:grid;place-items:center;cursor:pointer;flex:none;}
  .send svg{width:20px;height:20px;stroke:#fff;fill:none;}
  .send:disabled{background:var(--ink-faint);cursor:default;}

  /* settings drawer (top-right) */
  .scrim{position:fixed;inset:0;background:rgba(92,124,240,.10);backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;z-index:40;}
  .scrim.open{opacity:1;visibility:visible;}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(360px,90vw);background:var(--cream);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:50;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--line);}
  .drawer-head h2{font-family:var(--display);font-weight:600;font-size:21px;color:var(--forest-700);}
  .drawer-head .x{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--white);display:grid;place-items:center;cursor:pointer;}
  .drawer-head .x svg{width:18px;height:18px;stroke:var(--forest);}
  .drawer-body{padding:10px 24px 24px;overflow-y:auto;}
  .group-label{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--forest-300);margin:20px 0 8px;}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;background:var(--white);border:1px solid var(--line);border-radius:13px;margin-bottom:9px;}
  .srow .txt strong{display:block;font-size:14.5px;font-weight:600;}
  .srow .txt small{display:block;margin-top:2px;font-size:12px;color:var(--ink-soft);line-height:1.4;}
  .srow.link{cursor:pointer;}
  .srow.link .arrow{width:18px;height:18px;stroke:var(--ink-faint);flex:none;}
  /* toggle */
  .toggle{position:relative;flex:none;width:46px;height:27px;}
  .toggle input{position:absolute;opacity:0;width:0;height:0;}
  .track{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .22s;cursor:pointer;}
  .track::before{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(92,124,240,.06);transition:transform .22s cubic-bezier(.4,0,.2,1);}
  .toggle input:checked + .track{background:var(--grad-rich);}
  .toggle input:checked + .track::before{transform:translateX(19px);}
  /* language segmented */
  .seg{display:inline-flex;background:var(--cream);border-radius:999px;padding:3px;}
  .seg button{border:0;background:transparent;font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink-soft);padding:7px 14px;border-radius:999px;cursor:pointer;}
  .seg button.on{background:var(--grad-rich);color:#fff;}
  .logout{margin-top:8px;width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--white);color:#c0392b;font-family:var(--body);font-size:14.5px;font-weight:600;cursor:pointer;}

  /* ── persona management sub-view inside drawer ─────────────────────── */
  .pmv{display:none;flex-direction:column;height:100%;}
  .pmv.open{display:flex;}
  .pmv-head{display:flex;align-items:center;gap:12px;padding:22px 24px;border-bottom:1px solid var(--line);}
  .pmv-back{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--white);display:grid;place-items:center;cursor:pointer;flex:none;}
  .pmv-back svg{width:17px;height:17px;stroke:var(--forest);}
  .pmv-head h2{font-family:var(--display);font-weight:600;font-size:19px;color:var(--forest-700);}
  .pmv-list{overflow-y:auto;padding:12px 20px 20px;flex:1;min-height:0;}
  .pcard{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--white);border:1px solid var(--line);border-radius:13px;margin-bottom:9px;cursor:pointer;transition:background .14s;}
  .pcard:hover{background:var(--paper-sunken);}
  .pcard-ava{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:18px;color:#fff;background:var(--grad-rich2);box-shadow:0 4px 12px rgba(108,100,225,.22);}
  .pcard-info{flex:1;min-width:0;}
  .pcard-info strong{display:block;font-size:14.5px;font-weight:600;color:var(--ink);}
  .pcard-info small{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pcard-arrow{width:16px;height:16px;stroke:var(--ink-faint);flex:none;}
  .pmv-new{display:flex;align-items:center;gap:12px;padding:13px 14px;background:transparent;border:1.5px dashed var(--line-strong);border-radius:13px;cursor:pointer;color:var(--willow-press);font-family:var(--body);font-size:14px;font-weight:600;width:100%;margin-top:2px;transition:background .14s;}
  .pmv-new:hover{background:var(--willow-wash);}
  .pmv-new-icon{width:36px;height:36px;border-radius:12px;border:1.5px dashed var(--line-strong);display:grid;place-items:center;flex:none;}
  .pmv-new-icon svg{width:16px;height:16px;stroke:var(--willow);}

  /* ── generating glow: login-like pastel aurora while persona is replying ── */
  .phone.generating::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(520px 360px at 78% 12%, rgba(126,168,255,.30) 0%, transparent 60%),
      radial-gradient(480px 340px at 16% 22%, var(--willow-wash) 0%, transparent 58%),
      radial-gradient(460px 360px at 50% 92%, rgba(183,166,255,.24) 0%, transparent 60%);
    filter:blur(36px);
    opacity:0;animation:glowIn .5s ease forwards, glowPulse 2.6s ease-in-out .5s infinite;
  }
  @keyframes glowIn{to{opacity:1;}}
  @keyframes glowPulse{0%,100%{opacity:.7;}50%{opacity:1;}}
  /* keep chat content above the glow */
  .phone > *{position:relative;z-index:1;}

  /* typing indicator bubble */
  .typing{display:inline-flex;gap:5px;align-items:center;padding:13px 16px;}
  .typing span{width:7px;height:7px;border-radius:50%;background:linear-gradient(120deg,#7ea8ff,#b7a6ff,#f4b6d8);animation:typingBlink 1.2s ease-in-out infinite;}
  .typing span:nth-child(2){animation-delay:.18s;}
  .typing span:nth-child(3){animation-delay:.36s;}
  @keyframes typingBlink{0%,60%,100%{opacity:.3;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}

  /* ── subtle gradient wash on white boxes (cards) ── */
  .refblock{background:linear-gradient(135deg,rgba(126,168,255,.06) 0%,rgba(183,166,255,.05) 50%,var(--willow-wash) 100%),var(--white);}
  .drawer{background:linear-gradient(160deg,rgba(126,168,255,.05) 0%,var(--willow-wash) 100%),var(--cream);}
  .composer{background:linear-gradient(0deg,rgba(183,166,255,.04),rgba(183,166,255,.04)),var(--white);}

</style>
<script>
/* === security.js (inlined: no external dependency) === */
/* buddle frontend security utilities.
 *
 * Threat model & mitigations (see docs/security/SECURITY_FRONTEND.md):
 *  - Stored XSS: persona names, post text, topics come from other users via the
 *    API. NEVER inject them as HTML. Use esc() for text or el()/text() for DOM.
 *  - DOM-clobbering / injection via attributes: setText/setAttr helpers only.
 *  - Open redirect / javascript: URLs: safeUrl() allowlists schemes.
 *  - Token theft: tokens live in memory only (api.js), never in localStorage,
 *    never interpolated into HTML or URLs.
 *  - Clickjacking: pages set frame-ancestors via CSP meta + framebust check.
 *  - Prototype pollution: freeze, and reject __proto__ keys when parsing.
 */
(function (global) {
  "use strict";

  const NAMED = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "`": "&#96;" };

  /** Escape a string for safe insertion into HTML text/attribute context. */
  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"'`]/g, (c) => NAMED[c]);
  }

  /** Create an element with safe text + attributes (no HTML parsing). */
  function el(tag, attrs, textContent) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const k of Object.keys(attrs)) {
        const v = attrs[k];
        if (v == null) continue;
        if (k === "class") node.className = String(v);
        else if (k === "dataset" && typeof v === "object") {
          for (const dk of Object.keys(v)) node.dataset[dk] = String(v[dk]);
        } else if (/^on/i.test(k)) {
          // never accept event handlers as strings
          if (typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
        } else {
          node.setAttribute(k, String(v));
        }
      }
    }
    if (textContent != null) node.textContent = String(textContent);
    return node;
  }

  /** Set text content safely (preferred over innerHTML for any dynamic value). */
  function setText(node, value) { node.textContent = String(value == null ? "" : value); }

  /** Allowlist URL schemes; block javascript:, data:, vbscript:, etc. */
  function safeUrl(url) {
    const u = String(url || "").trim();
    if (/^(https?:|mailto:|\/|#)/i.test(u) && !/^javascript:/i.test(u)) return u;
    return "#";
  }

  /** Client-side input validation (defense in depth; server validates too). */
  const validate = {
    email(s) { return typeof s === "string" && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s) && s.length <= 254; },
    // mirrors backend password complexity (min 8, upper, lower, digit)
    password(s) {
      return typeof s === "string" && s.length >= 8 && s.length <= 200 &&
        /[a-z]/.test(s) && /[A-Z]/.test(s) && /\d/.test(s);
    },
    personaName(s) { return typeof s === "string" && s.trim().length >= 1 && s.length <= 64; },
    thought(s) { return typeof s === "string" && s.trim().length >= 1 && s.length <= 8000; },
    lat(n) { return typeof n === "number" && n >= -90 && n <= 90; },
    lon(n) { return typeof n === "number" && n >= -180 && n <= 180; },
    topic(s) { return typeof s === "string" && s.trim().length >= 1 && s.length <= 64; },
  };

  /** Reject prototype-pollution keys when handling parsed objects. */
  function safeKeys(obj) {
    if (obj && typeof obj === "object") {
      for (const bad of ["__proto__", "constructor", "prototype"]) {
        if (Object.prototype.hasOwnProperty.call(obj, bad)) delete obj[bad];
      }
    }
    return obj;
  }

  /** Frame-busting: if loaded inside a foreign frame, break out (anti-clickjacking). */
  function preventFraming() {
    try {
      if (global.top !== global.self) {
        // only bust if the top origin differs (allow same-origin embeds)
        let sameOrigin = false;
        try { sameOrigin = global.top.location.origin === global.location.origin; } catch (_) { sameOrigin = false; }
        if (!sameOrigin) global.top.location = global.location.href;
      }
    } catch (_) { /* cross-origin access throws — already protected by CSP */ }
  }

  /** Inject a restrictive CSP via meta (belt-and-suspenders with server headers). */
  function applyCSP() {
    if (document.querySelector('meta[http-equiv="Content-Security-Policy"]')) return;
    const m = document.createElement("meta");
    m.httpEquiv = "Content-Security-Policy";
    m.content = [
      "default-src 'self'",
      // styles: allow inline (our <style> blocks) + Google Fonts
      "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com",
      "font-src 'self' https://fonts.gstatic.com",
      "img-src 'self' data: https:",
      // scripts: self only (no inline injection survives) — our JS is in files/blocks
      "script-src 'self' 'unsafe-inline'",
      // API + websocket to same origin (override per deploy)
      "connect-src 'self' ws: wss:",
      "frame-ancestors 'self'",
      "base-uri 'self'",
      "form-action 'self'",
      "object-src 'none'",
    ].join("; ");
    document.head.appendChild(m);
  }

  /** One-call hardening for every page. */
  function harden() {
    applyCSP();
    preventFraming();
  }

  global.sec = Object.freeze({
    esc, el, setText, safeUrl, validate, safeKeys, preventFraming, applyCSP, harden,
  });
})(window);

<script>
/* === api.js (inlined) === */
/* buddle frontend API client — single source of truth for backend calls.
 *
 * Every field name / route here matches the FastAPI backend exactly (verified
 * against the Pydantic schemas and router paths). Screens import this instead
 * of hand-writing fetch() calls, so the front<->back contract lives in one place.
 *
 * Auth: JWT bearer. Tokens are cached in memory and write-through persisted to
 * sessionStorage (tab-scoped) so page navigation and refresh keep the session.
 * sessionStorage over localStorage on purpose: it dies with the tab, which
 * shrinks the blast radius of any XSS-stolen token and avoids cross-tab leaks.
 * Base URL defaults to same-origin; override with window.BUDDLE_API_BASE.
 */
(function (global) {
  "use strict";

  const BASE = global.BUDDLE_API_BASE || "";
  const TOKEN_KEY = "buddle.auth.v1";
  let accessToken = null;
  let refreshToken = null;

  // Hydrate once per page load. Storage may be unavailable (private mode,
  // blocked) — in that case we silently fall back to memory-only tokens.
  (function hydrate() {
    try {
      const raw = global.sessionStorage && global.sessionStorage.getItem(TOKEN_KEY);
      if (!raw) return;
      const t = JSON.parse(raw);
      if (t && typeof t.a === "string") {
        accessToken = t.a;
        refreshToken = typeof t.r === "string" ? t.r : null;
      }
    } catch (_) { /* memory-only */ }
  })();

  function persistTokens() {
    try {
      if (!global.sessionStorage) return;
      if (accessToken) {
        global.sessionStorage.setItem(TOKEN_KEY, JSON.stringify({ a: accessToken, r: refreshToken }));
      } else {
        global.sessionStorage.removeItem(TOKEN_KEY);
      }
    } catch (_) { /* quota/blocked → memory-only */ }
  }

  function setTokens(access, refresh) {
    accessToken = access || null;
    if (refresh !== undefined) refreshToken = refresh || null;
    persistTokens();
  }
  function clearTokens() { accessToken = null; refreshToken = null; persistTokens(); }

  async function request(method, path, body, { auth = true, retry = true } = {}) {
    const headers = { "Content-Type": "application/json" };
    if (auth && accessToken) headers["Authorization"] = `Bearer ${accessToken}`;
    const res = await fetch(BASE + path, {
      method,
      headers,
      body: body != null ? JSON.stringify(body) : undefined,
    });

    // transparent refresh on 401 (once)
    if (res.status === 401 && auth && retry && refreshToken) {
      const ok = await tryRefresh();
      if (ok) return request(method, path, body, { auth, retry: false });
    }
    if (!res.ok) {
      let detail = res.statusText;
      try { const j = await res.json(); detail = j.message || j.detail || detail; } catch (_) {}
      throw new ApiError(res.status, detail);
    }
    if (res.status === 204) return null;
    const ct = res.headers.get("content-type") || "";
    return ct.includes("application/json") ? res.json() : res.text();
  }

  class ApiError extends Error {
    constructor(status, message) { super(message); this.name = "ApiError"; this.status = status; }
  }

  async function tryRefresh() {
    try {
      const data = await request("POST", "/v1/auth/refresh",
        { refresh_token: refreshToken }, { auth: false, retry: false });
      setTokens(data.access_token, data.refresh_token);
      return true;
    } catch (_) { clearTokens(); return false; }
  }

  /* ── Auth ──────────────────────────────────────────────── */
  const auth = {
    // SignupRequest: { email, password, password_confirm }
    async signup(email, password, passwordConfirm) {
      return request("POST", "/v1/auth/signup",
        { email, password, password_confirm: passwordConfirm }, { auth: false });
    },
    // LoginRequest: { email, password } -> { access_token, refresh_token }
    async login(email, password) {
      const data = await request("POST", "/v1/auth/login",
        { email, password }, { auth: false });
      setTokens(data.access_token, data.refresh_token);
      return data;
    },
    // Revoke the refresh-token family server-side, then drop local tokens.
    // Network failures are ignored: the family still expires naturally.
    async logout() {
      const rt = refreshToken;
      try {
        if (rt && accessToken) {
          await request("POST", "/v1/auth/logout", { refresh_token: rt }, { retry: false });
        }
      } catch (_) { /* best-effort revoke */ }
      clearTokens();
    },
    isAuthed() { return !!accessToken; },
  };

  /* Soft auth gate for screens.
   *  - token present              → resolves true (render live).
   *  - no token + backend up      → redirects to login.html?next=… (resolves true;
   *                                  navigation is already underway).
   *  - no token + backend down    → resolves false (screen keeps offline demo mode).
   * This preserves the "open the file standalone and get a demo" property. */
  async function requireAuth(next) {
    if (accessToken) return true;
    let backendUp = false;
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 1500);
      const res = await fetch(BASE + "/health", { signal: ctl.signal });
      clearTimeout(timer);
      backendUp = res.ok;
    } catch (_) { backendUp = false; }
    if (backendUp) {
      const target = next || (location.pathname.split("/").pop() + location.search);
      location.replace(`login.html?next=${encodeURIComponent(target)}`);
      return true;
    }
    return false;
  }

  /* ── Users ─────────────────────────────────────────────── */
  const users = {
    me() { return request("GET", "/v1/users/me"); },
    update(patch) { return request("PATCH", "/v1/users/me", patch); },
  };

  /* ── Personas (location merged into create/update) ─────── */
  const personas = {
    list() { return request("GET", "/v1/personas"); },
    quota() { return request("GET", "/v1/personas/quota"); },
    models() { return request("GET", "/v1/persona-models"); },
    get(id) { return request("GET", `/v1/personas/${id}`); },
    // PersonaCreate: { name, model_key, interest_tag_ids[], location_sharing, location_lat, location_lon }
    create({ name, modelKey, interestTagIds = [], locationSharing = false, lat = null, lon = null }) {
      return request("POST", "/v1/personas", {
        name, model_key: modelKey, interest_tag_ids: interestTagIds,
        location_sharing: locationSharing, location_lat: lat, location_lon: lon,
      });
    },
    // PersonaUpdate: any subset of the above + is_active + preferred_language
    update(id, patch) {
      const body = {};
      if (patch.name !== undefined) body.name = patch.name;
      if (patch.modelKey !== undefined) body.model_key = patch.modelKey;
      if (patch.interestTagIds !== undefined) body.interest_tag_ids = patch.interestTagIds;
      if (patch.isActive !== undefined) body.is_active = patch.isActive;
      if (patch.locationSharing !== undefined) body.location_sharing = patch.locationSharing;
      if (patch.lat !== undefined) body.location_lat = patch.lat;
      if (patch.lon !== undefined) body.location_lon = patch.lon;
      return request("PATCH", `/v1/personas/${id}`, body);
    },
    remove(id) { return request("DELETE", `/v1/personas/${id}`); },
  };

  /* ── Posts (compose) ───────────────────────────────────── */
  const posts = {
    // PostCreate: { persona_id, content_raw, visibility: "public"|"private" }
    // NOTE: user posts go to /v1/posts. POST /v1/plaza/posts is the *agent*
    // route (X-Agent-Key auth) — wiring it here returns 401 for users.
    create({ personaId, contentRaw, visibility = "public" }) {
      return request("POST", "/v1/posts", {
        persona_id: personaId, content_raw: contentRaw, visibility,
      });
    },
    get(id) { return request("GET", `/v1/posts/${id}`); },
    like(id) { return request("PUT", `/v1/plaza/posts/${id}/like`); },
    unlike(id) { return request("DELETE", `/v1/plaza/posts/${id}/like`); },
    comments(id) { return request("GET", `/v1/plaza/posts/${id}/comments`); },
    addComment(id, content, kind = "inform") {
      return request("POST", `/v1/plaza/posts/${id}/comments`, { content, kind });
    },
  };

  /* ── Feed / Inbox ──────────────────────────────────────── */
  const feed = {
    list(cursor, tag) {
      const qs = new URLSearchParams();
      if (cursor) qs.set("cursor", cursor);
      if (tag && tag !== "전체") qs.set("tag", tag);
      const q = qs.toString();
      return request("GET", `/v1/feed${q ? `?${q}` : ""}`);
    },
  };
  const inbox = {
    list(cursor) { return request("GET", `/v1/inbox${cursor ? `?cursor=${encodeURIComponent(cursor)}` : ""}`); },
    listFor(personaId, cursor) {
      return request("GET", `/v1/inbox/persona/${personaId}${cursor ? `?cursor=${encodeURIComponent(cursor)}` : ""}`);
    },
    seen(id) { return request("POST", `/v1/inbox/${id}/seen`); },
  };

  /* ── Sessions (chat) ───────────────────────────────────── */
  const sessions = {
    list(personaId) { return request("GET", `/v1/personas/${personaId}/sessions`); },
    create(personaId, title, topic) {
      return request("POST", `/v1/personas/${personaId}/sessions`, { title, topic: topic || null });
    },
    messages(personaId, sessionId, limit = 40) {
      return request("GET", `/v1/personas/${personaId}/sessions/${sessionId}/messages?limit=${limit}`);
    },
    remove(personaId, sessionId) {
      return request("DELETE", `/v1/personas/${personaId}/sessions/${sessionId}`);
    },
  };

  /* ── Knowledge context (chat reference material) ───────── */
  const knowledge = {
    context(personaId, topic, limit = 8) {
      return request("GET", `/v1/personas/${personaId}/context?topic=${encodeURIComponent(topic)}&limit=${limit}`);
    },
    insights(personaId, topic) {
      return request("GET", `/v1/personas/${personaId}/context/insights?topic=${encodeURIComponent(topic)}`);
    },
  };

  /* ── Proximity (nearby matching) ───────────────────────── */
  const tags = {
    list({ q = null, limit = 50 } = {}) {
      const qs = new URLSearchParams();
      if (q) qs.set("q", q);
      qs.set("limit", String(limit));
      return request("GET", `/v1/tags?${qs.toString()}`);
    },
  };

  const proximity = {
    nearby(personaId, limit = 20) {
      return request("GET", `/v1/proximity/personas/${personaId}/nearby?limit=${limit}`);
    },
    setLocation(personaId, { lat, lon, sharing }) {
      return request("PUT", `/v1/proximity/personas/${personaId}/location`,
        { lat, lon, sharing });
    },
  };

  const relationship = {
    // Current persona<->user bond (Social-Penetration level + stage label).
    get(personaId) {
      return request("GET", `/v1/personas/${personaId}/relationship`);
    },
  };

  /* ── Dialogue WebSocket (chat live) ────────────────────── */
  function openDialogue(personaId, { onMessage, onOpen, onClose } = {}) {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const wsBase = BASE.replace(/^https?:/, proto) || `${proto}//${location.host}`;
    const ws = new WebSocket(`${wsBase}/v1/ws/dialogue/${personaId}`);
    ws.addEventListener("open", () => {
      // first frame authenticates (WS auth via first message, not query)
      if (accessToken) ws.send(JSON.stringify({ type: "auth", token: accessToken }));
      onOpen && onOpen();
    });
    ws.addEventListener("message", (e) => {
      let msg; try { msg = JSON.parse(e.data); } catch (_) { return; }
      onMessage && onMessage(msg);
    });
    ws.addEventListener("close", () => onClose && onClose());
    return {
      socket: ws,
      // ClientUserMessage: { type:"user_message", content, session_id? }
      send(content, sessionId) {
        ws.send(JSON.stringify({ type: "user_message", content, session_id: sessionId || null }));
      },
      close() { ws.close(); },
    };
  }

  const debate = {
    // 채팅 메시지를 "근거"로 추가 (tag_id 없이 화제 이름만으로 — 토론이 아직 없어도 됨).
    addStanceByName(topicName, stance, claim, grounds) {
      return request("POST", "/v1/topics/by-name/stance",
        { topic_name: topicName, stance, claim, grounds: grounds || [] });
    },
  };

  global.buddle = {
    ApiError, setTokens, clearTokens, requireAuth,
    auth, users, personas, tags, posts, feed, inbox, sessions, knowledge, proximity, relationship, debate,
    openDialogue,
  };
})(window);






</script>

  <div class="gsheet-actions">
    <button class="gbtn-ghost" id="gsheetCancel" type="button">취소</button>
    <button class="gbtn-fill" id="gsheetSubmit" type="button">토론에 추가</button>
  </div>
</div>

<div class="gtoast" id="gtoast"></div>

<script>
  sec.harden();

  // ── live dialogue state (real backend WS; demo fallback when standalone) ──
  let live = null;          // openDialogue handle once connected
  let liveReady = false;    // true after server 'auth_ok'
  const livePersonaId = new URLSearchParams(location.search).get("persona");

  // ── demo state (replace with API: GET /v1/personas, GET /v1/personas/{id}/sessions, WS dialogue) ──
  // 대화 중 전환 가능한 페르소나 목록 (persona-select.html을 흡수 — 별도 페이지 불필요).
  const personaList = [
    { id: "p1", name: "초록", ava: "초", model: "기본 대화 모델", tags: ["일상", "산책", "커피"] },
    { id: "p2", name: "물결", ava: "물", model: "기본 대화 모델", tags: ["음악", "영화"] },
    { id: "p3", name: "햇살", ava: "햇", model: "기본 대화 모델", tags: ["독서", "글쓰기", "역사"] },
    { id: "p4", name: "바람", ava: "바", model: "Bilingual model", tags: ["러닝", "등산"] },
  ];
  // URL ?persona=ID 로 들어오면 그 페르소나를 초기 선택, 아니면 첫 번째.
  let persona = personaList.find(p => p.id === new URLSearchParams(location.search).get("persona")) || personaList[0];
  const sessionList = [
    { id: "s1", title: "동네 산책", active: true },
    { id: "s2", title: "주말 러닝" },
    { id: "s3", title: "카페 탐방" },
  ];
  // messages per session (demo)
  const history = {
    s1: [
      { role: "me", text: "오늘 동네 산책했는데 강가 코스가 좋더라." },
      { role: "persona", text: "강가 코스 정말 좋죠! 아침 시간대가 한적해서 특히 추천해요. 혹시 어느 구간을 걸으셨어요?" },
      { ref: true, items: [
        { text: "강가 코스가 아침에 한적하다", insight: false },
        { text: "산책 후 카페에서 마무리하는 사람이 많다", insight: false },
        { text: "통합 인사이트: '동네 산책'은 운동보다 휴식·환기 목적이 우세", insight: true },
      ]},
      { role: "me", text: "둔치 쪽으로 한 시간 정도 걸었어. 같이 할 사람 있으면 좋겠다." },
      { role: "persona", text: "한 시간이면 딱 좋은 거리네요. 근처에 비슷한 관심을 가진 분들이 있는지 살펴볼까요? 위치 기반 대화가 켜져 있으면 가까운 분들과 자연스럽게 이어질 수 있어요." },
    ],
    s2: [ { role: "persona", text: "주말 러닝 얘기를 시작해볼까요? 목표 거리나 페이스가 있으세요?" } ],
    s3: [ { role: "persona", text: "요즘 다녀온 카페 중 기억에 남는 곳이 있나요?" } ],
  };

  let currentSession = "s1";

  // render session chips
  const sessionsEl = document.getElementById("sessions");
  function renderSessions() {
    sessionsEl.innerHTML = "";
    sessionList.forEach(s => {
      const b = document.createElement("button");
      b.className = "schip" + (s.id === currentSession ? " on" : "");
      b.textContent = s.title;
      b.onclick = () => { currentSession = s.id; renderSessions(); renderMsgs(); updateHead(); };
      sessionsEl.appendChild(b);
    });
    const nu = document.createElement("button");
    nu.className = "schip new";
    nu.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>새 주제';
    nu.onclick = () => console.log("new topic → compose or empty chat");
    sessionsEl.appendChild(nu);
  }

  // render messages
  const msgsEl = document.getElementById("msgs");
  function renderMsgs() {
    msgsEl.innerHTML = "";
    (history[currentSession] || []).forEach((m, i) => {
      if (m.ref) { msgsEl.appendChild(refBlock(m.items)); return; }
      const row = document.createElement("div");
      row.className = "row " + m.role;
      const ava = m.role === "persona"
        ? `<div class="m-ava">${sec.esc(persona.ava)}</div>` : "";
      row.innerHTML = `${ava}<div class="msgwrap">
        <div class="bubble">${escapeHtml(m.text)}</div>
        <button class="ground-add" type="button" data-msg-i="${i}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>근거로 추가
        </button>
      </div>`;
      msgsEl.appendChild(row);
    });
    msgsEl.scrollTop = msgsEl.scrollHeight;
    msgsEl.querySelectorAll(".ground-add").forEach(btn => {
      btn.addEventListener("click", () => {
        const m = (history[currentSession] || [])[Number(btn.dataset.msgI)];
        if (m) openGroundSheet(m.text);
      });
    });
  }

  function refBlock(items) {
    const el = document.createElement("div");
    el.className = "refblock";
    el.innerHTML = `
      <div class="ref-head">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        참고 자료
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="ref-body">
        ${items.map(i => `<div class="ref-item${i.insight ? " insight" : ""}">${sec.esc(i.text)}</div>`).join("")}
      </div>`;
    el.querySelector(".ref-head").onclick = () => el.classList.toggle("open");
    return el;
  }

  // Social-Penetration stage labels (mirrors RelationshipLevel 0..4).
  const REL_LABELS = [
    "막 알아가는 사이",   // 0 orientation
    "조금씩 친해지는 중",  // 1 exploratory
    "마음을 나누는 사이",  // 2 affective
    "편안하고 가까운 사이", // 3 stable
    "깊이 신뢰하는 사이",  // 4 intimate
  ];
  let relationshipLevel = 0;

  function renderRelationship() {
    const leaves = document.getElementById("relLeaves");
    if (leaves) {
      leaves.replaceChildren(...Array.from({ length: 4 }, (_, i) => {
        const leaf = document.createElement("i");
        if (i < relationshipLevel) leaf.classList.add("on");
        return leaf;
      }));
    }
    const label = document.getElementById("relLabel");
    if (label) label.textContent = REL_LABELS[Math.max(0, Math.min(4, relationshipLevel))];
  }

  function updateHead() {
    // 이름만 갱신하고 chevron 아이콘은 보존 (firstChild = 텍스트 노드).
    const h = document.getElementById("headName");
    h.firstChild.nodeValue = persona.name;
    document.getElementById("headAva").textContent = persona.ava;
    renderRelationship();
  }

  /* ── 페르소나 선택기 (Claude식 드롭다운, 대화 중 전환) ────── */
  const ppMenu = document.getElementById("ppMenu");
  const ppBackdrop = document.getElementById("ppBackdrop");
  const ppTrigger = document.getElementById("personaPicker");

  function renderPersonaMenu() {
    ppMenu.replaceChildren();
    const label = sec.el("div", { class: "pp-label" }, "어떤 나로 이야기할까요");
    ppMenu.appendChild(label);
    personaList.forEach(p => {
      const item = sec.el("button", {
        class: "pp-item" + (p.id === persona.id ? " on" : ""),
        role: "menuitem",
      });
      item.innerHTML = `
        <div class="pp-ava">${sec.esc(p.ava)}</div>
        <div class="pp-meta">
          <strong>${sec.esc(p.name)}</strong>
          <small>${sec.esc(p.model)} · ${sec.esc(p.tags.join(", "))}</small>
        </div>
        <svg class="pp-check" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;
      item.addEventListener("click", () => { selectPersona(p.id); });
      ppMenu.appendChild(item);
    });
    const nu = sec.el("button", { class: "pp-new" });
    nu.innerHTML = `<span class="pp-plus"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>새 페르소나 만들기`;
    nu.addEventListener("click", () => { location.href = "persona-create.html"; });
    ppMenu.appendChild(nu);
  }

  function openPersonaMenu() {
    renderPersonaMenu();
    ppBackdrop.style.display = ""; ppMenu.style.display = "";
    ppTrigger.setAttribute("aria-expanded", "true");
  }
  function closePersonaMenu() {
    ppBackdrop.style.display = "none"; ppMenu.style.display = "none";
    ppTrigger.setAttribute("aria-expanded", "false");
  }
  function selectPersona(id) {
    const p = personaList.find(x => x.id === id);
    if (p) { persona = p; updateHead(); renderMsgs(); }
    closePersonaMenu();
  }
  ppTrigger.addEventListener("click", () => {
    (ppMenu.style.display === "none" ? openPersonaMenu : closePersonaMenu)();
  });
  ppBackdrop.addEventListener("click", closePersonaMenu);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePersonaMenu(); });

  function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  // composer
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
    send.disabled = input.value.trim() === "";
  });
  function doSend() {
    const text = input.value.trim();
    if (!text) return;
    (history[currentSession] ||= []).push({ role: "me", text });
    input.value = ""; input.style.height = "auto"; send.disabled = true;
    renderMsgs();

    // begin generating: glow the background (login-like) + show typing bubble
    const phone = document.querySelector(".phone");
    phone.classList.add("generating");
    showTyping();

    // Live backend: send over the dialogue WS. The reply arrives asynchronously
    // as a 'persona_message' frame, which calls finishReply() (see setupLiveDialogue).
    if (live && liveReady) {
      try {
        live.send(text, null); // session_id null -> backend default session
        return;
      } catch (_) { /* fall through to demo */ }
    }

    // Demo fallback (page opened standalone without a backend / persona).
    setTimeout(() => {
      finishReply("(페르소나 응답이 여기에 표시됩니다)");
    }, 1400);
  }

  function showTyping() {
    hideTyping();
    const row = sec.el("div", { class: "row persona", id: "typingRow" });
    row.appendChild(sec.el("div", { class: "m-ava" }, persona.ava));
    const bubble = sec.el("div", { class: "bubble" });
    const typing = sec.el("div", { class: "typing" });
    typing.appendChild(sec.el("span")); typing.appendChild(sec.el("span")); typing.appendChild(sec.el("span"));
    bubble.appendChild(typing);
    row.appendChild(bubble);
    msgsEl.appendChild(row);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }
  function hideTyping() {
    const t = document.getElementById("typingRow");
    if (t) t.remove();
  }
  function finishReply(text) {
    const phone = document.querySelector(".phone");
    phone.classList.remove("generating"); // stop the glow
    hideTyping();
    history[currentSession].push({ role: "persona", text });
    renderMsgs();
  }

  // ── live relationship: fetch the real Social-Penetration level so the
  // header indicator reflects the actual bond (demo fallback stays at Lv0). ──
  async function loadRelationship() {
    if (!livePersonaId) return;
    if (!(buddle.auth && buddle.auth.isAuthed && buddle.auth.isAuthed())) return;
    try {
      const rel = await buddle.relationship.get(livePersonaId);
      if (rel && typeof rel.level === "number") {
        relationshipLevel = Math.max(0, Math.min(4, rel.level));
        if (rel.stage_label) {
          const label = document.getElementById("relLabel");
          if (label) label.textContent = rel.stage_label;
        }
        renderRelationship();
      }
    } catch (_) { /* offline / no bond yet → keep demo Lv0 */ }
  }

  // ── wire the live dialogue WS to the chat UI ──
  // Activates only when ?persona=<id> is present and the user is authenticated;
  // otherwise the demo fallback in doSend() keeps the standalone preview working.
  function setupLiveDialogue() {
    if (live || !livePersonaId) return;
    if (!(buddle.auth && buddle.auth.isAuthed && buddle.auth.isAuthed())) return;
    live = buddle.openDialogue(livePersonaId, {
      onMessage(msg) {
        if (!msg || !msg.type) return;
        if (msg.type === "auth_ok") { liveReady = true; return; }
        if (msg.type === "typing") { if (msg.state === "start") showTyping(); return; }
        if (msg.type === "persona_message") {
          finishReply(String(msg.content || ""));
          // The bond may have shifted this turn — refresh the indicator.
          loadRelationship();
          return;
        }
        if (msg.type === "error") {
          finishReply(
            msg.code === "RATE_LIMITED"
              ? "메시지를 너무 빨리 보냈어요. 잠시 후 다시 시도해 주세요."
              : "응답을 가져오지 못했어요. 잠시 후 다시 시도해 주세요."
          );
        }
      },
      onClose() { liveReady = false; live = null; },
    });
  }
  setupLiveDialogue();
  loadRelationship();
  send.addEventListener("click", doSend);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doSend(); }
  });
  document.getElementById("composeBtn").onclick = () => {
    location.href = "compose.html" + (livePersonaId ? `?persona=${encodeURIComponent(livePersonaId)}` : "");
  };

  // settings drawer
  const scrim = document.getElementById("scrim");
  const drawer = document.getElementById("drawer");
  const openBtn = document.getElementById("openSettings");
  const closeBtn = document.getElementById("closeSettings");
  function openSettings(){ scrim.classList.add("open"); drawer.classList.add("open"); drawer.setAttribute("aria-hidden","false"); closeBtn.focus(); }
  function closeSettings(){
    scrim.classList.remove("open"); drawer.classList.remove("open"); drawer.setAttribute("aria-hidden","true"); openBtn.focus();
    // also reset any open sub-view
    const pmv = document.getElementById("personaMgmtView");
    const sm = document.getElementById("settingsMain");
    if (pmv && pmv.classList.contains("open")) {
      pmv.classList.remove("open");
      if (sm) sm.style.display = "flex";
    }
  }
  openBtn.onclick = openSettings;
  closeBtn.onclick = closeSettings;
  scrim.onclick = closeSettings;
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSettings(); });

  // location toggle (default ON) — on integration: PATCH /v1/personas/{id} {location_sharing}
  document.getElementById("locToggle").addEventListener("change", e => {
    console.log("location-based chat:", e.target.checked ? "ON" : "OFF");
  });
  // language segmented — on integration: PATCH /v1/personas/{id} {preferred_language} or users/me
  document.getElementById("langSeg").addEventListener("click", e => {
    const btn = e.target.closest("button"); if (!btn) return;
    [...e.currentTarget.children].forEach(b => b.classList.toggle("on", b === btn));
    console.log("preferred language:", btn.dataset.lang);
  });
  // persona management sub-view
  const settingsMain = document.getElementById("settingsMain");
  const personaMgmtView = document.getElementById("personaMgmtView");
  const pmvList = document.getElementById("pmvList");

  function openPersonaMgmt() {
    settingsMain.style.display = "none";
    personaMgmtView.classList.add("open");
    renderPersonaMgmt();
  }
  function closePersonaMgmt() {
    personaMgmtView.classList.remove("open");
    settingsMain.style.display = "flex";
  }

  function renderPersonaMgmt() {
    pmvList.innerHTML = "";
    const list = (typeof personas !== "undefined" && Array.isArray(personas)) ? personas : personaList;
    list.forEach(p => {
      const card = document.createElement("div");
      card.className = "pcard";
      const avaGrads = ["var(--grad-rich2)","linear-gradient(135deg,#6F8FF5,#F0AFDA)","linear-gradient(135deg,#A98DEE,#6F8FF5)","linear-gradient(135deg,#5dc9c8,#6F8FF5)"];
      const gradIdx = list.indexOf(p) % avaGrads.length;
      const tags = Array.isArray(p.tags) ? p.tags.join(" · ") : (p.tags || "");
      const model = p.model || p.model_key || "기본 모델";
      card.innerHTML = `
        <div class="pcard-ava" style="background:${avaGrads[gradIdx]}">${sec.esc(p.ava || (p.name||"?")[0])}</div>
        <div class="pcard-info">
          <strong>${sec.esc(p.name || "페르소나")}</strong>
          <small>${sec.esc(model)}${tags ? " · " + sec.esc(tags) : ""}</small>
        </div>
        <svg class="pcard-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>`;
      card.addEventListener("click", () => {
        location.href = `persona-create.html?edit=${encodeURIComponent(p.id)}`;
      });
      pmvList.appendChild(card);
    });
    const newBtn = document.createElement("button");
    newBtn.className = "pmv-new";
    newBtn.innerHTML = `<span class="pmv-new-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>새 페르소나 만들기`;
    newBtn.addEventListener("click", () => { location.href = "persona-create.html"; });
    pmvList.appendChild(newBtn);
  }

  document.getElementById("managePersona").onclick = openPersonaMgmt;
  document.getElementById("pmvBack").onclick = closePersonaMgmt;
  document.getElementById("logout").onclick = async () => {
    try { await buddle.auth.logout(); } catch (_) {}
    location.replace("login.html");
  };

  /* ── 근거로 추가 ────────────────────────────────────────── */
  function currentTopicName() {
    const s = sessionList.find(x => x.id === currentSession);
    return (s && s.title) || "";
  }

  let gPickedStance = "neutral";
  function openGroundSheet(messageText) {
    document.getElementById("gsheetTopic").textContent = `${currentTopicName()} 토론에 추가돼요`;
    document.getElementById("gClaimInput").value = "";
    document.getElementById("gGroundsInput").value = messageText || "";
    gPickedStance = "neutral";
    document.querySelectorAll(".gsp").forEach(b => b.classList.toggle("on", b.dataset.stance === "neutral"));
    document.getElementById("gsheetBackdrop").style.display = "";
    document.getElementById("groundSheet").style.display = "";
    document.getElementById("gClaimInput").focus();
  }
  function closeGroundSheet() {
    document.getElementById("gsheetBackdrop").style.display = "none";
    document.getElementById("groundSheet").style.display = "none";
  }
  document.getElementById("gsheetBackdrop").addEventListener("click", closeGroundSheet);
  document.getElementById("gsheetCancel").addEventListener("click", closeGroundSheet);
  document.querySelectorAll(".gsp").forEach(btn => {
    btn.addEventListener("click", () => {
      gPickedStance = btn.dataset.stance;
      document.querySelectorAll(".gsp").forEach(b => b.classList.remove("on"));
      btn.classList.add("on");
    });
  });

  let gtoastTimer = null;
  function showGToast(html) {
    const t = document.getElementById("gtoast");
    t.innerHTML = html;
    t.classList.add("show");
    clearTimeout(gtoastTimer);
    gtoastTimer = setTimeout(() => t.classList.remove("show"), 3200);
  }

  document.getElementById("gsheetSubmit").addEventListener("click", async () => {
    const claim = document.getElementById("gClaimInput").value.trim();
    if (!claim) { document.getElementById("gClaimInput").focus(); return; }
    const grounds = document.getElementById("gGroundsInput").value
      .split("\n").map(s => s.trim()).filter(Boolean);
    const topicName = currentTopicName();
    const submitBtn = document.getElementById("gsheetSubmit");
    submitBtn.disabled = true; submitBtn.textContent = "추가 중…";

    const authed = buddle.auth && buddle.auth.isAuthed && buddle.auth.isAuthed();
    if (!authed) {
      // 데모 모드: 저장 없이 토론에 더해진 것처럼 피드백만 보여줌
      setTimeout(() => {
        closeGroundSheet();
        submitBtn.disabled = false; submitBtn.textContent = "토론에 추가";
        showGToast(`<span>“${sec.esc(topicName)}” 토론에 추가했어요 (데모)</span>`);
      }, 500);
      return;
    }
    try {
      await buddle.debate.addStanceByName(topicName, gPickedStance, claim, grounds);
      closeGroundSheet();
      submitBtn.disabled = false; submitBtn.textContent = "토론에 추가";
      showGToast(`<span>“${sec.esc(topicName)}” 토론에 추가했어요</span> · <a href="debate-dashboard.html?tag=${encodeURIComponent(topicName)}">보러 가기</a>`);
    } catch (_) {
      submitBtn.disabled = false; submitBtn.textContent = "다시 시도";
    }
  });

  renderSessions(); renderMsgs(); updateHead();
</script>
</body>
</html>
