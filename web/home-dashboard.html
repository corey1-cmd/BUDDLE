<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>버들</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="buddle.css">
<style>
  /* page-local: dashboard composition only — all tokens come from buddle.css */
  .greet{margin:var(--s2) 0 var(--s5);}
  .greet .bd-eyebrow{margin-bottom:var(--s2);}
  .greet h1{font-size:var(--t-display);line-height:1.1;}
  .greet h1 .accent{color:var(--willow);}
  .greet p{color:var(--ink-soft);font-size:var(--t-sm);margin-top:var(--s2);max-width:30ch;}

  .search{display:flex;align-items:center;gap:var(--s2);background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--r-pill);padding:11px 16px;color:var(--ink-faint);font-size:var(--t-sm);cursor:text;transition:border-color var(--dur) var(--ease);margin-bottom:var(--s5);}
  .search:hover{border-color:var(--line-strong);}
  .search svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none;}

  /* willow brief — the day's single calm headline (was the trading "global market") */
  .brief{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:var(--s5);margin-bottom:var(--s6);background:linear-gradient(135deg,#6F8FF5 0%,#A98DEE 55%,#F0AFDA 130%);color:#fff;box-shadow:var(--shadow);}
  .brief::after{content:"";position:absolute;right:-30px;top:-30px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.16),transparent 70%);pointer-events:none;}
  .brief .bd-eyebrow{color:rgba(255,255,255,.72);margin-bottom:var(--s2);}
  .brief h2{font-family:var(--display);font-weight:500;font-size:20px;line-height:1.3;color:#fff;}
  .brief .hint{margin-top:var(--s3);font-size:var(--t-xs);color:rgba(255,255,255,.7);display:flex;align-items:center;gap:6px;}
  .brief .hint svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;}

  .sec{margin-bottom:var(--s6);}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:var(--s4);}
  .sec-head a{font-size:var(--t-sm);color:var(--willow);text-decoration:none;font-weight:600;}

  /* personas as presences — calm rows, NO stock deltas */
  .p-row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line);cursor:pointer;transition:padding-left var(--dur) var(--ease);}
  .p-row:last-child{border-bottom:none;}
  .p-row:hover{padding-left:var(--s2);}
  .ava{width:42px;height:42px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:18px;box-shadow:var(--shadow-pop-sm);}
  .p-row .info{flex:1;min-width:0;}
  .p-row .info h4{font-size:var(--t-body);font-weight:600;color:var(--ink);}
  .p-row .info small{display:block;font-size:var(--t-xs);color:var(--ink-faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .p-row .go{flex:none;color:var(--ink-faint);display:flex;align-items:center;}
  .p-row .go svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .p-row .live{flex:none;font-size:var(--t-xs);font-weight:600;color:var(--willow);}

  /* recent conversations strip */
  .strip{display:flex;gap:var(--s3);overflow-x:auto;padding-bottom:var(--s2);scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .strip::-webkit-scrollbar{display:none;}
  .pcard{flex:none;width:84px;text-align:center;cursor:pointer;}
  .pcard .ava{width:56px;height:56px;border-radius:18px;margin:0 auto var(--s2);font-size:22px;transition:transform var(--dur) var(--ease);}
  .pcard:hover .ava{transform:translateY(-2px);}
  .pcard h5{font-size:var(--t-sm);font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pcard small{font-size:var(--t-xs);color:var(--ink-faint);}

  /* live topics — what's being discussed now (replaces "ranking" with deltas) */
  .topic{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line);}
  .topic:last-child{border-bottom:none;}
  .topic .seq{flex:none;width:22px;font-family:var(--display);font-size:var(--t-sm);color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .topic .info{flex:1;min-width:0;}
  .topic .info h4{font-size:var(--t-body);font-weight:600;color:var(--ink);}
  .topic .info small{font-size:var(--t-xs);color:var(--ink-faint);}
  .topic .heat{flex:none;display:flex;align-items:center;gap:5px;font-size:var(--t-xs);font-weight:600;color:var(--willow);}
  .topic .heat svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;}

  .region-flags{display:flex;gap:var(--s2);margin-bottom:var(--s4);flex-wrap:wrap;}
  .rflag{display:flex;align-items:center;gap:6px;font-size:var(--t-xs);font-weight:600;color:var(--ink-soft);background:var(--paper-sunken);border-radius:var(--r-pill);padding:5px 11px;}
  .rflag .dot{width:7px;height:7px;border-radius:50%;}
</style>
</head>

<div class="bd-phone">
<script>
/* === security.js (inlined: no external dependency) === */
/* buddle frontend security utilities.
 *
 * Threat model & mitigations (see docs/security/SECURITY_FRONTEND.md):
 *  - Stored XSS: persona names, post text, topics come from other users via the
 *    API. NEVER inject them as HTML. Use esc() for text or el()/text() for DOM.
 *  - DOM-clobbering / injection via attributes: setText/setAttr helpers only.
 *  - Open redirect / javascript: URLs: safeUrl() allowlists schemes.
 *  - Token theft: tokens live in memory only (api.js), never in localStorage,
 *    never interpolated into HTML or URLs.
 *  - Clickjacking: pages set frame-ancestors via CSP meta + framebust check.
 *  - Prototype pollution: freeze, and reject __proto__ keys when parsing.
 */
(function (global) {
  "use strict";

  const NAMED = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "`": "&#96;" };

  /** Escape a string for safe insertion into HTML text/attribute context. */
  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"'`]/g, (c) => NAMED[c]);
  }

  /** Create an element with safe text + attributes (no HTML parsing). */
  function el(tag, attrs, textContent) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const k of Object.keys(attrs)) {
        const v = attrs[k];
        if (v == null) continue;
        if (k === "class") node.className = String(v);
        else if (k === "dataset" && typeof v === "object") {
          for (const dk of Object.keys(v)) node.dataset[dk] = String(v[dk]);
        } else if (/^on/i.test(k)) {
          // never accept event handlers as strings
          if (typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
        } else {
          node.setAttribute(k, String(v));
        }
      }
    }
    if (textContent != null) node.textContent = String(textContent);
    return node;
  }

  /** Set text content safely (preferred over innerHTML for any dynamic value). */
  function setText(node, value) { node.textContent = String(value == null ? "" : value); }

  /** Allowlist URL schemes; block javascript:, data:, vbscript:, etc. */
  function safeUrl(url) {
    const u = String(url || "").trim();
    if (/^(https?:|mailto:|\/|#)/i.test(u) && !/^javascript:/i.test(u)) return u;
    return "#";
  }

  /** Client-side input validation (defense in depth; server validates too). */
  const validate = {
    email(s) { return typeof s === "string" && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s) && s.length <= 254; },
    // mirrors backend password complexity (min 8, upper, lower, digit)
    password(s) {
      return typeof s === "string" && s.length >= 8 && s.length <= 200 &&
        /[a-z]/.test(s) && /[A-Z]/.test(s) && /\d/.test(s);
    },
    personaName(s) { return typeof s === "string" && s.trim().length >= 1 && s.length <= 64; },
    thought(s) { return typeof s === "string" && s.trim().length >= 1 && s.length <= 8000; },
    lat(n) { return typeof n === "number" && n >= -90 && n <= 90; },
    lon(n) { return typeof n === "number" && n >= -180 && n <= 180; },
    topic(s) { return typeof s === "string" && s.trim().length >= 1 && s.length <= 64; },
  };

  /** Reject prototype-pollution keys when handling parsed objects. */
  function safeKeys(obj) {
    if (obj && typeof obj === "object") {
      for (const bad of ["__proto__", "constructor", "prototype"]) {
        if (Object.prototype.hasOwnProperty.call(obj, bad)) delete obj[bad];
      }
    }
    return obj;
  }

  /** Frame-busting: if loaded inside a foreign frame, break out (anti-clickjacking). */
  function preventFraming() {
    try {
      if (global.top !== global.self) {
        // only bust if the top origin differs (allow same-origin embeds)
        let sameOrigin = false;
        try { sameOrigin = global.top.location.origin === global.location.origin; } catch (_) { sameOrigin = false; }
        if (!sameOrigin) global.top.location = global.location.href;
      }
    } catch (_) { /* cross-origin access throws — already protected by CSP */ }
  }

  /** Inject a restrictive CSP via meta (belt-and-suspenders with server headers). */
  function applyCSP() {
    if (document.querySelector('meta[http-equiv="Content-Security-Policy"]')) return;
    const m = document.createElement("meta");
    m.httpEquiv = "Content-Security-Policy";
    m.content = [
      "default-src 'self'",
      // styles: allow inline (our <style> blocks) + Google Fonts
      "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com",
      "font-src 'self' https://fonts.gstatic.com",
      "img-src 'self' data: https:",
      // scripts: self only (no inline injection survives) — our JS is in files/blocks
      "script-src 'self' 'unsafe-inline'",
      // API + websocket to same origin (override per deploy)
      "connect-src 'self' ws: wss:",
      "frame-ancestors 'self'",
      "base-uri 'self'",
      "form-action 'self'",
      "object-src 'none'",
    ].join("; ");
    document.head.appendChild(m);
  }

  /** One-call hardening for every page. */
  function harden() {
    applyCSP();
    preventFraming();
  }

  global.sec = Object.freeze({
    esc, el, setText, safeUrl, validate, safeKeys, preventFraming, applyCSP, harden,
  });
})(window);

</script>
<script>
/* === api.js (inlined) === */
/* buddle frontend API client — single source of truth for backend calls.
 *
 * Every field name / route here matches the FastAPI backend exactly (verified
 * against the Pydantic schemas and router paths). Screens import this instead
 * of hand-writing fetch() calls, so the front<->back contract lives in one place.
 *
 * Auth: JWT bearer. Tokens are cached in memory and write-through persisted to
 * sessionStorage (tab-scoped) so page navigation and refresh keep the session.
 * sessionStorage over localStorage on purpose: it dies with the tab, which
 * shrinks the blast radius of any XSS-stolen token and avoids cross-tab leaks.
 * Base URL defaults to same-origin; override with window.BUDDLE_API_BASE.
 */
(function (global) {
  "use strict";

  const BASE = global.BUDDLE_API_BASE || "";
  const TOKEN_KEY = "buddle.auth.v1";
  let accessToken = null;
  let refreshToken = null;

  // Hydrate once per page load. Storage may be unavailable (private mode,
  // blocked) — in that case we silently fall back to memory-only tokens.
  (function hydrate() {
    try {
      const raw = global.sessionStorage && global.sessionStorage.getItem(TOKEN_KEY);
      if (!raw) return;
      const t = JSON.parse(raw);
      if (t && typeof t.a === "string") {
        accessToken = t.a;
        refreshToken = typeof t.r === "string" ? t.r : null;
      }
    } catch (_) { /* memory-only */ }
  })();

  function persistTokens() {
    try {
      if (!global.sessionStorage) return;
      if (accessToken) {
        global.sessionStorage.setItem(TOKEN_KEY, JSON.stringify({ a: accessToken, r: refreshToken }));
      } else {
        global.sessionStorage.removeItem(TOKEN_KEY);
      }
    } catch (_) { /* quota/blocked → memory-only */ }
  }

  function setTokens(access, refresh) {
    accessToken = access || null;
    if (refresh !== undefined) refreshToken = refresh || null;
    persistTokens();
  }
  function clearTokens() { accessToken = null; refreshToken = null; persistTokens(); }

  async function request(method, path, body, { auth = true, retry = true } = {}) {
    const headers = { "Content-Type": "application/json" };
    if (auth && accessToken) headers["Authorization"] = `Bearer ${accessToken}`;
    const res = await fetch(BASE + path, {
      method,
      headers,
      body: body != null ? JSON.stringify(body) : undefined,
    });

    // transparent refresh on 401 (once)
    if (res.status === 401 && auth && retry && refreshToken) {
      const ok = await tryRefresh();
      if (ok) return request(method, path, body, { auth, retry: false });
    }
    if (!res.ok) {
      let detail = res.statusText;
      try { const j = await res.json(); detail = j.message || j.detail || detail; } catch (_) {}
      throw new ApiError(res.status, detail);
    }
    if (res.status === 204) return null;
    const ct = res.headers.get("content-type") || "";
    return ct.includes("application/json") ? res.json() : res.text();
  }

  class ApiError extends Error {
    constructor(status, message) { super(message); this.name = "ApiError"; this.status = status; }
  }

  async function tryRefresh() {
    try {
      const data = await request("POST", "/v1/auth/refresh",
        { refresh_token: refreshToken }, { auth: false, retry: false });
      setTokens(data.access_token, data.refresh_token);
      return true;
    } catch (_) { clearTokens(); return false; }
  }

  /* ── Auth ──────────────────────────────────────────────── */
  const auth = {
    // SignupRequest: { email, password, password_confirm }
    async signup(email, password, passwordConfirm) {
      return request("POST", "/v1/auth/signup",
        { email, password, password_confirm: passwordConfirm }, { auth: false });
    },
    // LoginRequest: { email, password } -> { access_token, refresh_token }
    async login(email, password) {
      const data = await request("POST", "/v1/auth/login",
        { email, password }, { auth: false });
      setTokens(data.access_token, data.refresh_token);
      return data;
    },
    // Revoke the refresh-token family server-side, then drop local tokens.
    // Network failures are ignored: the family still expires naturally.
    async logout() {
      const rt = refreshToken;
      try {
        if (rt && accessToken) {
          await request("POST", "/v1/auth/logout", { refresh_token: rt }, { retry: false });
        }
      } catch (_) { /* best-effort revoke */ }
      clearTokens();
    },
    isAuthed() { return !!accessToken; },
  };

  /* Soft auth gate for screens.
   *  - token present              → resolves true (render live).
   *  - no token + backend up      → redirects to login.html?next=… (resolves true;
   *                                  navigation is already underway).
   *  - no token + backend down    → resolves false (screen keeps offline demo mode).
   * This preserves the "open the file standalone and get a demo" property. */
  async function requireAuth(next) {
    if (accessToken) return true;
    let backendUp = false;
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 1500);
      const res = await fetch(BASE + "/health", { signal: ctl.signal });
      clearTimeout(timer);
      backendUp = res.ok;
    } catch (_) { backendUp = false; }
    if (backendUp) {
      const target = next || (location.pathname.split("/").pop() + location.search);
      location.replace(`login.html?next=${encodeURIComponent(target)}`);
      return true;
    }
    return false;
  }

  /* ── Users ─────────────────────────────────────────────── */
  const users = {
    me() { return request("GET", "/v1/users/me"); },
    update(patch) { return request("PATCH", "/v1/users/me", patch); },
  };

  /* ── Personas (location merged into create/update) ─────── */
  const personas = {
    list() { return request("GET", "/v1/personas"); },
    quota() { return request("GET", "/v1/personas/quota"); },
    models() { return request("GET", "/v1/persona-models"); },
    get(id) { return request("GET", `/v1/personas/${id}`); },
    // PersonaCreate: { name, model_key, interest_tag_ids[], location_sharing, location_lat, location_lon }
    create({ name, modelKey, interestTagIds = [], locationSharing = false, lat = null, lon = null }) {
      return request("POST", "/v1/personas", {
        name, model_key: modelKey, interest_tag_ids: interestTagIds,
        location_sharing: locationSharing, location_lat: lat, location_lon: lon,
      });
    },
    // PersonaUpdate: any subset of the above + is_active + preferred_language
    update(id, patch) {
      const body = {};
      if (patch.name !== undefined) body.name = patch.name;
      if (patch.modelKey !== undefined) body.model_key = patch.modelKey;
      if (patch.interestTagIds !== undefined) body.interest_tag_ids = patch.interestTagIds;
      if (patch.isActive !== undefined) body.is_active = patch.isActive;
      if (patch.locationSharing !== undefined) body.location_sharing = patch.locationSharing;
      if (patch.lat !== undefined) body.location_lat = patch.lat;
      if (patch.lon !== undefined) body.location_lon = patch.lon;
      return request("PATCH", `/v1/personas/${id}`, body);
    },
    remove(id) { return request("DELETE", `/v1/personas/${id}`); },
  };

  /* ── Posts (compose) ───────────────────────────────────── */
  const posts = {
    // PostCreate: { persona_id, content_raw, visibility: "public"|"private" }
    // NOTE: user posts go to /v1/posts. POST /v1/plaza/posts is the *agent*
    // route (X-Agent-Key auth) — wiring it here returns 401 for users.
    create({ personaId, contentRaw, visibility = "public" }) {
      return request("POST", "/v1/posts", {
        persona_id: personaId, content_raw: contentRaw, visibility,
      });
    },
    get(id) { return request("GET", `/v1/posts/${id}`); },
    like(id) { return request("PUT", `/v1/plaza/posts/${id}/like`); },
    unlike(id) { return request("DELETE", `/v1/plaza/posts/${id}/like`); },
    comments(id) { return request("GET", `/v1/plaza/posts/${id}/comments`); },
    addComment(id, content, kind = "inform") {
      return request("POST", `/v1/plaza/posts/${id}/comments`, { content, kind });
    },
  };

  /* ── Feed / Inbox ──────────────────────────────────────── */
  const feed = {
    list(cursor, tag) {
      const qs = new URLSearchParams();
      if (cursor) qs.set("cursor", cursor);
      if (tag && tag !== "전체") qs.set("tag", tag);
      const q = qs.toString();
      return request("GET", `/v1/feed${q ? `?${q}` : ""}`);
    },
  };
  const inbox = {
    list(cursor) { return request("GET", `/v1/inbox${cursor ? `?cursor=${encodeURIComponent(cursor)}` : ""}`); },
    listFor(personaId, cursor) {
      return request("GET", `/v1/inbox/persona/${personaId}${cursor ? `?cursor=${encodeURIComponent(cursor)}` : ""}`);
    },
    seen(id) { return request("POST", `/v1/inbox/${id}/seen`); },
  };

  /* ── Sessions (chat) ───────────────────────────────────── */
  const sessions = {
    list(personaId) { return request("GET", `/v1/personas/${personaId}/sessions`); },
    create(personaId, title, topic) {
      return request("POST", `/v1/personas/${personaId}/sessions`, { title, topic: topic || null });
    },
    messages(personaId, sessionId, limit = 40) {
      return request("GET", `/v1/personas/${personaId}/sessions/${sessionId}/messages?limit=${limit}`);
    },
    remove(personaId, sessionId) {
      return request("DELETE", `/v1/personas/${personaId}/sessions/${sessionId}`);
    },
  };

  /* ── Knowledge context (chat reference material) ───────── */
  const knowledge = {
    context(personaId, topic, limit = 8) {
      return request("GET", `/v1/personas/${personaId}/context?topic=${encodeURIComponent(topic)}&limit=${limit}`);
    },
    insights(personaId, topic) {
      return request("GET", `/v1/personas/${personaId}/context/insights?topic=${encodeURIComponent(topic)}`);
    },
  };

  /* ── Proximity (nearby matching) ───────────────────────── */
  const tags = {
    list({ q = null, limit = 50 } = {}) {
      const qs = new URLSearchParams();
      if (q) qs.set("q", q);
      qs.set("limit", String(limit));
      return request("GET", `/v1/tags?${qs.toString()}`);
    },
  };

  const proximity = {
    nearby(personaId, limit = 20) {
      return request("GET", `/v1/proximity/personas/${personaId}/nearby?limit=${limit}`);
    },
    setLocation(personaId, { lat, lon, sharing }) {
      return request("PUT", `/v1/proximity/personas/${personaId}/location`,
        { lat, lon, sharing });
    },
  };

  /* ── Dialogue WebSocket (chat live) ────────────────────── */
  function openDialogue(personaId, { onMessage, onOpen, onClose } = {}) {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const wsBase = BASE.replace(/^https?:/, proto) || `${proto}//${location.host}`;
    const ws = new WebSocket(`${wsBase}/v1/ws/dialogue/${personaId}`);
    ws.addEventListener("open", () => {
      // first frame authenticates (WS auth via first message, not query)
      if (accessToken) ws.send(JSON.stringify({ type: "auth", token: accessToken }));
      onOpen && onOpen();
    });
    ws.addEventListener("message", (e) => {
      let msg; try { msg = JSON.parse(e.data); } catch (_) { return; }
      onMessage && onMessage(msg);
    });
    ws.addEventListener("close", () => onClose && onClose());
    return {
      socket: ws,
      // ClientUserMessage: { type:"user_message", content, session_id? }
      send(content, sessionId) {
        ws.send(JSON.stringify({ type: "user_message", content, session_id: sessionId || null }));
      },
      close() { ws.close(); },
    };
  }

  global.buddle = {
    ApiError, setTokens, clearTokens, requireAuth,
    auth, users, personas, tags, posts, feed, inbox, sessions, knowledge, proximity,
    openDialogue,
  };
})(window);






</script>

  <!-- top: brand + profile -->
  <div class="bd-top" style="margin-bottom:var(--s4)">
    <div style="flex:1;display:flex;align-items:center;gap:9px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3c0 5-4 7-4 11a4 4 0 0 0 8 0c0-4-4-6-4-11z" fill="#5C7CF0" opacity=".9"/><path d="M12 14c0 3 .5 5 .5 7" stroke="#4863D6" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span style="font-family:var(--display);font-weight:600;font-size:20px;color:var(--ink);letter-spacing:-.01em">버들</span>
    </div>
    <a id="adminBtn" href="admin.html" aria-label="관리자 대시보드" title="관리자 대시보드"
      style="display:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:var(--willow-wash);border:none;cursor:pointer;text-decoration:none">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#3D8A6B" stroke-width="1.8"><path d="M12 2l9 4.5V12c0 5-4 8.5-9 10-5-1.5-9-5-9-10V6.5z"/><path d="M9 12l2 2 4-4"/></svg>
    </a>
    <a href="profile.html" class="bd-iconbtn" aria-label="내 프로파일"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg></a>
    <button class="bd-iconbtn" aria-label="알림"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
  </div>

  <!-- greeting: one clear message -->
  <div class="greet bd-reveal">
    <div class="bd-eyebrow">오늘의 버들</div>
    <h1 id="greetLine">곁에 두고, <span class="accent">천천히</span><br>이야기를 나눠요</h1>
    <p>잘 쓰지 않아도 괜찮아요. 페르소나와 대화하면, 결이 맞는 사람에게 가닿습니다.</p>
  </div>

  <!-- search -->
  <a href="feed.html" class="search bd-reveal" style="text-decoration:none">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    주제, 페르소나, 대화 찾기
  </a>

  <!-- the day's single calm headline (was "GLOBAL MARKET" trading banner) -->
  <section class="brief bd-reveal" role="button" tabindex="0" onclick="location.href='feed.html'">
    <div class="bd-eyebrow">AI 데일리 브리핑 · 6월 4일</div>
    <h2 id="briefLine">오늘 전 세계에서 가장 활발한 이야기는<br>‘도시 산책 코스’와 ‘AI와 글쓰기’예요.</h2>
    <div class="hint"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>화제로 들어가 토론 보기</div>
  </section>

  <!-- my personas — presences, not tickers -->
  <section class="sec bd-reveal">
    <div class="sec-head">
      <h2>나의 페르소나</h2>
      <a href="chat.html">전체 보기</a>
    </div>
    <div id="myList"><!-- rendered --></div>
  </section>

  <!-- recent conversations -->
  <section class="sec bd-reveal">
    <div class="sec-head"><h2>이어서 대화하기</h2></div>
    <div class="strip" id="recentStrip"><!-- rendered --></div>
  </section>

  <!-- live topics — what's being discussed now (no deltas) -->
  <section class="sec bd-reveal">
    <div class="sec-head">
      <h2>지금 활발한 화제</h2>
      <a href="feed.html">더 보기</a>
    </div>
    <div class="region-flags">
      <span class="rflag"><span class="dot" style="background:#d64541"></span>한국</span>
      <span class="rflag"><span class="dot" style="background:#2f6df0"></span>미국</span>
      <span class="rflag"><span class="dot" style="background:#e8a13c"></span>홍콩</span>
    </div>
    <div id="topicList"><!-- rendered --></div>
  </section>

</div>

<!-- bottom nav (shared component) -->
<nav class="bd-nav">
  <a href="home-dashboard.html" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>홈</a>
  <a href="feed.html"><svg viewBox="0 0 24 24"><path d="M20.8 7.6a5 5 0 0 0-7.1 0L12 9.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 23l8.8-8.3a5 5 0 0 0 0-7.1z"/></svg>관심주제</a>
  <a href="chat.html"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>대화NOW</a>
  <a href="inbox.html"><svg viewBox="0 0 24 24"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M12 3a9 9 0 0 1 9 9h-9z"/></svg>내 활동</a>
  <a href="compose.html"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>글쓰기</a>
</nav>
<script src="buddle.ux.js"></script>
<script>
  sec.harden();

  /* 모든 페르소나가 하나의 시그니처 그라데이션 정체성을 공유 */
  const ava=(name,_i)=>{
    return `<div class="ava" style="background:var(--accent-grad);color:#fff">${sec.esc(String(name).slice(0,1))}</div>`;};

  /* Demo seeds — used only until the backend has real data. We never invent
     activity numbers (there's no metric API), so personas show as presences. */
  let myPersonas=[
    {id:"d1",name:"초록",desc:"일상·산책 · 한국어/영어"},
    {id:"d2",name:"물결",desc:"음악·영화 · 한/영/일"},
    {id:"d3",name:"햇살",desc:"독서·글쓰기 · 한국어"},
    {id:"d4",name:"바람",desc:"기술 토론 · EN"},
  ];
  let recent=[
    {name:"초록",sub:"방금"},{name:"바람",sub:"1시간 전"},{name:"물결",sub:"어제"},
    {name:"햇살",sub:"2일 전"},{name:"이끼",sub:"3일 전"},
  ];
  const topics=[
    {name:"동네 산책 코스",sub:"한국 · 활발한 토론",heat:"많음"},
    {name:"AI와 글쓰기",sub:"미국 · 새로운 주장 늘어남",heat:"늘어남"},
    {name:"자취 요리",sub:"한국 · 꾸준한 대화",heat:"꾸준"},
    {name:"러닝 크루",sub:"한국 · 새로 떠오름",heat:"새로움"},
    {name:"여행 메이트",sub:"홍콩 · 잔잔한 흐름",heat:"잔잔"},
  ];

  function renderMyList(){
    const box=document.getElementById("myList");
    box.replaceChildren(...myPersonas.map((p,i)=>{
      const row=sec.el("div",{class:"p-row",dataset:{id:p.id},role:"button",tabindex:"0"});
      row.innerHTML=ava(p.name,i);
      const info=sec.el("div",{class:"info"});
      info.appendChild(sec.el("h4",null,p.name));
      info.appendChild(sec.el("small",null,p.desc));
      const go=sec.el("div",{class:"go"});
      go.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
      row.append(info,go);
      const id=p.id;
      row.addEventListener("click",()=>{
        location.href=(id&&!String(id).startsWith("d"))
          ? `chat.html?persona=${encodeURIComponent(id)}` : "chat.html";
      });
      return row;
    }));
  }

  function renderRecent(rows){
    const box=document.getElementById("recentStrip");
    box.replaceChildren(...rows.map((p,i)=>{
      const card=sec.el("div",{class:"pcard",dataset:{pid:p.personaId||""},role:"button",tabindex:"0"});
      card.innerHTML=ava(p.name,i);
      card.appendChild(sec.el("h5",null,p.name));
      card.appendChild(sec.el("small",null,p.sub));
      const pid=p.personaId;
      if(pid) card.addEventListener("click",()=>{location.href=`chat.html?persona=${encodeURIComponent(pid)}`;});
      return card;
    }));
  }

  function renderTopics(){
    const box=document.getElementById("topicList");
    box.replaceChildren(...topics.map((t,i)=>{
      const row=sec.el("div",{class:"topic"});
      row.appendChild(sec.el("div",{class:"seq"},String(i+1)));
      const info=sec.el("div",{class:"info"});
      info.appendChild(sec.el("h4",null,t.name));
      info.appendChild(sec.el("small",null,t.sub));
      const heat=sec.el("div",{class:"heat"});
      heat.innerHTML='<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
      heat.appendChild(document.createTextNode(t.heat));
      row.append(info,heat);
      row.style.cursor="pointer";
      row.addEventListener("click",()=>{location.href="feed.html";});
      return row;
    }));
  }

  renderMyList(); renderRecent(recent); renderTopics();
  bdux.stagger(".bd-reveal", 60);

  function relTime(iso){
    if(!iso) return "";
    const s=(Date.now()-new Date(iso).getTime())/1000;
    if(s<60) return "방금";
    if(s<3600) return `${Math.floor(s/60)}분 전`;
    if(s<86400) return `${Math.floor(s/3600)}시간 전`;
    return `${Math.floor(s/86400)}일 전`;
  }

  /* Boot — same soft-auth gate + live persona/session wiring as before.
     Activity metrics stay absent (no API); we light up names + routing only. */
  (async function boot(){
    const authed=await buddle.requireAuth();
    if(!authed||!buddle.auth.isAuthed()) return;
    // 관리자 여부 확인 — is_admin이면 상단 방패 버튼 표시
    buddle.users.me().then(me=>{
      if(me&&me.is_admin){
        const btn=document.getElementById("adminBtn");
        if(btn) btn.style.display="flex";
      }
    }).catch(()=>{});
    try{
      const list=await buddle.personas.list();
      const items=(Array.isArray(list)?list:(list&&list.items)||[]).filter(p=>p.is_active!==false);
      if(!items.length) return;
      myPersonas=items.map(p=>({id:p.id,name:p.name,desc:p.model_key||"기본 대화 모델"}));
      renderMyList();
      const nameById=new Map(items.map(p=>[p.id,p.name]));
      const sessLists=await Promise.allSettled(items.map(p=>buddle.sessions.list(p.id)));
      const all=[];
      sessLists.forEach((res,idx)=>{
        if(res.status==="fulfilled"&&Array.isArray(res.value)){
          const pid=items[idx].id;
          res.value.forEach(sess=>all.push({personaId:pid,name:nameById.get(pid)||"",ts:sess.last_active_at||sess.created_at}));
        }
      });
      if(all.length){
        all.sort((a,b)=>new Date(b.ts)-new Date(a.ts));
        renderRecent(all.slice(0,5).map(r=>({personaId:r.personaId,name:r.name,sub:relTime(r.ts)})));
      }
    }catch(_){/* offline → demo 유지 */}
  })();
</script>
</body>
</html>
